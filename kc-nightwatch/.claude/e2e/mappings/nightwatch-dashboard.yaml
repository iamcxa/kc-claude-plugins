version: 2
app: nightwatch-dashboard
base_url: "http://127.0.0.1:3201"

auth:
  type: none

codebase:
  routes_glob: "app/client/pages/*.ts"
  source_patterns: ["app/client/**/*.ts"]

pages:
  _global:
    description: "Elements visible on all pages"
    elements:
      scheduler_toggle:
        selector: "role=button[name='ON']"
        description: "Scheduler ON/OFF toggle in the top schedule bar"
        note: "Text changes between 'ON' and 'OFF' based on state"
      schedule_bar_text:
        selector: "text=/Scheduler:.*Next in/"
        description: "Schedule bar showing interval and next run countdown"
      last_run_text:
        selector: "text=/Last run:/"
        description: "Last run timestamp in the schedule bar"
      nav_dashboard:
        selector: "role=link[name='Dashboard']"
        description: "Bottom nav link to Dashboard page"
      nav_runs:
        selector: "role=link[name='Runs']"
        description: "Bottom nav link to Runs page"
      nav_outcomes:
        selector: "role=link[name='Outcomes']"
        description: "Bottom nav link to Outcomes page"
      nav_health:
        selector: "role=link[name='Health']"
        description: "Bottom nav link to Health page"
      nav_config:
        selector: "role=link[name='Config']"
        description: "Bottom nav link to Config page"
      chat_fab:
        selector: "role=button[name='Open NW-Claude chat']"
        description: "Floating action button to open/close the NW-Claude chat drawer"
        note: "Text content changes to 'X' when chat is open"
      chat_dialog:
        selector: "role=dialog[name='NW-Claude chat']"
        description: "Chat drawer overlay panel"
      chat_reset_button:
        selector: "role=button[name='Reset conversation']"
        description: "Reset button in chat drawer header"
      chat_close_button:
        selector: "role=button[name='Close chat']"
        description: "Close button (X) in chat drawer header"
      chat_input:
        selector: "role=textbox[name='Ask NW-Claude...']"
        description: "Chat message input textbox"
      chat_send_button:
        selector: "role=button[name='Send']"
        description: "Send button for chat messages, disabled when input is empty"

  dashboard:
    url_pattern: "/#/dashboard"
    description: "Master-detail view with target sidebar and target detail panel"
    elements:
      sidebar:
        selector: "role=complementary"
        description: "Left sidebar containing the target list"
      target_list:
        selector: "role=complementary >> role=list"
        description: "List of monitoring targets in the sidebar"
      target_item:
        selector: "role=listitem >> nth=0"
        description: "A single target item in the sidebar list. Click to select and show detail."
        note: "Sidebar items use event delegation (cursor: pointer). Select by text content."
      target_item_by_name:
        selector: "role=complementary >> text=${targetName}"
        description: "Target sidebar item by name. ${targetName} is the display name (e.g. 'kc-plugin-forge')."
      add_target_button:
        selector: "role=button[name='+ Add Target']"
        description: "Button at bottom of sidebar to add a new monitoring target"
      run_all_button:
        selector: "role=button[name='Run All']"
        description: "Button to trigger all targets. Disabled when no targets are runnable."
      empty_state_text:
        selector: "text=Select a target from the sidebar to view details"
        description: "Placeholder text shown when no target is selected"

  dashboard-detail:
    url_pattern: "/#/dashboard"
    description: "Target detail panel shown after selecting a sidebar target"
    elements:
      target_heading:
        selector: "role=heading[level=2]"
        description: "Target name heading (e.g. 'kc-plugin-forge')"
      target_type_badge:
        selector: "text=/^plugin$|^product$/"
        description: "Badge showing target type next to the heading"
      north_star_text:
        selector: "text=North star"
        description: "North star section label"
      schedule_label:
        selector: "text=Schedule"
        description: "Schedule section label in target detail"
      schedule_interval_text:
        selector: "text=/Every \\d+h/"
        description: "Schedule interval display (e.g. 'Every 6h (global)' or 'Every 4h')"
      schedule_countdown_text:
        selector: "text=/Not yet scheduled|Next in/"
        description: "Countdown to next run or 'Not yet scheduled' when no run is planned"
      run_button:
        selector: "role=button[name='Run']"
        description: "Run button for the selected target (production mode)"
      dry_run_button:
        selector: "role=button[name='Dry run']"
        description: "Dry run button for the selected target"
      more_menu_button:
        selector: "role=button[name='⋮']"
        description: "Ellipsis (more) menu button opening dropdown actions"
      last_run_status:
        selector: "text=Last run"
        description: "Last run status section in target detail"

  dashboard-detail-menu:
    url_pattern: "/#/dashboard"
    description: "Dropdown menu opened by the ellipsis button on target detail"
    elements:
      menu_run:
        selector: "role=button[name='Run'] >> nth=1"
        description: "Run option in the dropdown menu"
        note: "nth=1 to distinguish from the main Run button (nth=0)"
      menu_dry_run:
        selector: "role=button[name='Dry run'] >> nth=1"
        description: "Dry run option in the dropdown menu"
        note: "nth=1 to distinguish from the main Dry run button (nth=0)"
      menu_edit:
        selector: "role=button[name='Edit']"
        description: "Edit option in the dropdown menu (currently disabled)"
      menu_chat:
        selector: "role=button[name='Chat']"
        description: "Chat option in the dropdown menu (currently disabled)"
      menu_remove_target:
        selector: "role=button[name='Remove target']"
        description: "Remove target option in the dropdown menu (destructive, shown in red)"

  runs:
    url_pattern: "/#/runs"
    description: "Run history list with filters"
    elements:
      status_filter:
        selector: "role=combobox >> nth=0"
        description: "Dropdown to filter runs by status (All statuses, Completed, Failed, Running, Queued, Cancelled)"
      target_filter:
        selector: "role=combobox >> nth=1"
        description: "Dropdown to filter runs by target name"
      run_row:
        selector: "css=[style*='cursor: pointer'] >> nth=0"
        description: "A single run row in the list. Click to view run detail."
        note: "Run rows are div elements with cursor:pointer style, using event delegation"

  runs-detail:
    url_pattern: "/#/runs"
    description: "Detail view for a single run, showing log output"
    elements:
      back_to_runs_link:
        selector: "role=link[name='← Back to runs']"
        description: "Link to navigate back to the runs list"
      show_raw_button:
        selector: "role=button[name='Show raw']"
        description: "Toggle to show raw log output"
      log_output:
        selector: "role=log"
        description: "Log output area showing run progress and results"

  outcomes:
    url_pattern: "/#/outcomes"
    description: "Outcome tracking list with filters for PRs and Linear issues created by runs"
    elements:
      target_filter:
        selector: "role=combobox >> nth=0"
        description: "Dropdown to filter outcomes by target name (All targets, plus dynamic target names)"
      type_filter:
        selector: "role=combobox >> nth=1"
        description: "Dropdown to filter outcomes by type (All types, pr, linear_issue)"
      status_filter:
        selector: "role=combobox >> nth=2"
        description: "Dropdown to filter outcomes by status (All statuses, open, merged, closed, completed, cancelled)"
      outcome_item:
        selector: "css=[style*='cursor: pointer'] >> nth=0"
        description: "A single outcome row in the list. Click to view detail."
        note: "Outcome rows are div elements with cursor:pointer style, showing type badge, target name, and status dot"
      empty_state_heading:
        selector: "text=No outcomes recorded yet"
        description: "Empty state heading when no outcomes exist"
      empty_state_subtext:
        selector: "text=Outcomes appear here after a run creates PRs or Linear issues."
        description: "Empty state description text"
      no_match_text:
        selector: "text=No outcomes match the current filters."
        description: "Text shown when filters exclude all outcomes"

  outcomes-detail:
    url_pattern: "/#/outcomes"
    description: "Detail view for a selected outcome showing metadata fields"
    elements:
      back_link:
        selector: "role=link[name='← Back to outcomes']"
        description: "Link to navigate back to the outcomes list"
        note: "Uses onClick to clear selectedId, not actual navigation"
      target_field:
        selector: "text=Target"
        description: "Target field label in the detail panel"
      type_field:
        selector: "text=Type"
        description: "Type field label in the detail panel"
      status_field:
        selector: "text=Status"
        description: "Status field label with colored dot indicator"
      created_field:
        selector: "text=Created"
        description: "Created timestamp field showing relative time"
      signal_id_field:
        selector: "text=Signal ID"
        description: "Signal ID field label (monospace value)"
      run_id_field:
        selector: "text=Run ID"
        description: "Run ID field label (monospace value)"
      url_field:
        selector: "text=URL"
        description: "URL field label with clickable link to GitHub PR or Linear issue"
      check_status_button:
        selector: "role=button[name='Check status']"
        description: "Button to refresh the outcome status from the external service"
        note: "Text changes to 'Checking...' while loading"

  health:
    url_pattern: "/#/health"
    description: "Flywheel health dashboard showing per-target health metrics and reject rate charts"
    elements:
      page_title:
        selector: "text=Flywheel Health"
        description: "Page title heading"
      overall_status:
        selector: "text=/Overall:/"
        description: "Overall health status with trend indicator (e.g. 'Overall: Improving')"
      gathering_data_text:
        selector: "text=/Gathering data/"
        description: "Info banner shown when insufficient runs for full health metrics"
      target_health_card:
        selector: "text=${targetName}"
        description: "Per-target health card heading. ${targetName} is the target display name."
      runs_analyzed_text:
        selector: "text=/\\d+ runs analyzed/"
        description: "Run count for a target health card"
        note: "Appears once per target card"
      proposals_accepted_text:
        selector: "text=/Proposals accepted:/"
        description: "Proposal acceptance rate line in target health card"
        note: "Format: 'Proposals accepted: N/M (P%)' with trend arrow"
      reject_rate_heading:
        selector: "text=Reject Rate by Indicator"
        description: "Section heading for the reject rate sparkline charts"
      reject_rate_chart:
        selector: "role=graphics-document >> nth=0"
        description: "SVG sparkline chart for an indicator's reject rate"
        note: "Multiple charts rendered, one per indicator per target. Use nth for specific chart."

  config:
    url_pattern: "/#/config"
    description: "YAML configuration editor with Targets and Safety tabs"
    elements:
      targets_tab:
        selector: "role=tab[name='Targets']"
        description: "Tab to show targets configuration"
      safety_tab:
        selector: "role=tab[name='Safety']"
        description: "Tab to show safety configuration"
      edit_button:
        selector: "role=button[name='Edit']"
        description: "Button to enter edit mode (enables textarea)"
      add_target_config_button:
        selector: "role=button[name='+ Add Target']"
        description: "Button to add a new target (visible on Targets tab)"
      targets_textarea:
        selector: "role=textbox[name='Targets configuration']"
        description: "YAML editor textarea for targets config. Disabled in read-only mode."
      safety_textarea:
        selector: "role=textbox[name='Safety configuration']"
        description: "YAML editor textarea for safety config. Disabled in read-only mode."

  config-edit-mode:
    url_pattern: "/#/config"
    description: "Config page in edit mode after clicking Edit button"
    elements:
      validate_button:
        selector: "role=button[name='Validate']"
        description: "Button to validate YAML before saving (replaces Edit button)"
      discard_changes_button:
        selector: "role=button[name='Discard Changes']"
        description: "Button to discard edits and return to read-only mode"

  add-target-wizard-step1:
    url_pattern: "/#/dashboard"
    description: "Add Target wizard Step 1: basic info (type, name, path)"
    elements:
      dialog:
        selector: "role=dialog[name='Add Target']"
        description: "The wizard modal dialog"
      dialog_heading:
        selector: "role=heading[name='Add Target']"
        description: "Dialog title heading"
      close_button:
        selector: "role=button[name='X']"
        description: "Close button to dismiss the wizard"
      type_plugin_button:
        selector: "role=button[name='Plugin']"
        description: "Button to select Plugin target type"
      type_product_button:
        selector: "role=button[name='Product']"
        description: "Button to select Product target type"
      name_input:
        selector: "role=textbox[name='e.g. my-plugin']"
        description: "Target name text input"
      path_input:
        selector: "role=textbox[name='/absolute/path/to/target']"
        description: "Optional absolute path text input"
      next_button:
        selector: "role=button[name='Next']"
        description: "Next button to advance to Step 2. Disabled until name is entered."

  add-target-wizard-step2:
    url_pattern: "/#/dashboard"
    description: "Add Target wizard Step 2: north star and watch keywords"
    elements:
      north_star_input:
        selector: "role=textbox[name='What is the ultimate goal for improving this target?']"
        description: "North star goal text input"
      keywords_input:
        selector: "role=textbox[name='e.g. coverage, test, performance']"
        description: "Comma-separated watch keywords text input"
      back_button:
        selector: "role=button[name='Back']"
        description: "Back button to return to Step 1"
      next_button:
        selector: "role=button[name='Next']"
        description: "Next button to advance to Step 3"

  add-target-wizard-step3:
    url_pattern: "/#/dashboard"
    description: "Add Target wizard Step 3: monitors and respond actions"
    elements:
      monitor_github_issues:
        selector: "role=checkbox[name='github-issues']"
        description: "Checkbox to enable github-issues monitor"
      monitor_journal:
        selector: "role=checkbox[name='journal']"
        description: "Checkbox to enable journal monitor"
      monitor_git_churn:
        selector: "role=checkbox[name='git-churn']"
        description: "Checkbox to enable git-churn monitor"
      monitor_sentry:
        selector: "role=checkbox[name='sentry']"
        description: "Checkbox to enable sentry monitor"
      monitor_e2e_reports:
        selector: "role=checkbox[name='e2e-reports']"
        description: "Checkbox to enable e2e-reports monitor"
      action_code_fix:
        selector: "role=checkbox[name='code-fix']"
        description: "Checkbox to enable code-fix respond action"
      action_proposal:
        selector: "role=checkbox[name='proposal']"
        description: "Checkbox to enable proposal respond action"
      action_e2e_flow:
        selector: "role=checkbox[name='e2e-flow']"
        description: "Checkbox to enable e2e-flow respond action"
      back_button:
        selector: "role=button[name='Back']"
        description: "Back button to return to Step 2"
      next_schedule_button:
        selector: "role=button[name='Next: Schedule']"
        description: "Next button to advance to Step 4 (Schedule)"

  add-target-wizard-step4:
    url_pattern: "/#/dashboard"
    description: "Add Target wizard Step 4: optional per-target schedule override"
    elements:
      use_global_schedule_checkbox:
        selector: "role=checkbox[name='Use global schedule']"
        description: "Checkbox to use the global schedule interval. Checked by default."
      custom_interval_input:
        selector: "role=spinbutton[name='e.g. 6']"
        description: "Custom interval hours input. Only visible when 'Use global schedule' is unchecked."
      interval_error_text:
        selector: "text=Minimum interval is 10 minutes"
        description: "Validation error when custom interval is too short"
      back_button:
        selector: "role=button[name='Back']"
        description: "Back button to return to Step 3"
      next_button:
        selector: "role=button[name='Next']"
        description: "Next button to advance to Step 5 (Review)"

  add-target-wizard-step5:
    url_pattern: "/#/dashboard"
    description: "Add Target wizard Step 5: review generated YAML and save"
    elements:
      yaml_preview:
        selector: "text=/Generated YAML preview/"
        description: "Label above the generated YAML preview block"
      back_button:
        selector: "role=button[name='Back']"
        description: "Back button to return to Step 4"
      validate_save_button:
        selector: "role=button[name='Validate & Save']"
        description: "Button to validate and save the new target configuration"
