# Local Dev Flow Binding
#
# Copy this to one machine-readable file the repository owns — `docs/dev/
# kernel-binding.yaml` is the usual place. The workflow entrypoint links to it
# and does not restate it, so there is one place to read and one place to change.
#
# The binding lives in its own file rather than inside the workflow document
# because a checker that has to find it inside prose reports success for a
# repository that has none. Four revisions of the checker did exactly that.
#
# What the checker enforces: a prose *filename* is refused; an unindented,
# uncommented line declaring anything but the keys below is refused by name; and
# an indented line with no key above it is refused as a value of nothing.
#
# What it cannot enforce: which file you name, and what you put in the values. A
# file that is a well-formed binding record IS a binding as far as any parser can
# tell, whatever its prose says about itself. Keep the binding in a file that
# holds only the binding, and the question does not arise.
#
# Verify with the kernel-owned checker rather than by reading:
#
#     python3 <installed kc-dev-flow>/scripts/verify-binding.py <this file>
#
# It takes no package path. It resolves `kernel_source` against the installed
# releases itself, because a checker told where to look confirms only that the
# binding agrees with whatever it was handed — the same internally-consistent
# staleness it exists to detect.
#
# It reports one of PASS, STALE_COMPATIBLE, REBIND_REQUIRED, or UNRESOLVABLE,
# exits non-zero on every outcome except PASS, and prints the entrypoint path the
# agent is expected to read. Declared-but-unverifiable is UNRESOLVABLE, a
# different state from undeclared, and the two must not read the same.
#
# `kernel_version` states compatibility intent; `kernel_digest` identifies the
# exact bytes agreed to. Neither alone suffices: a version cannot see that the
# text moved under a reused number, and a digest cannot see that a newer release
# exists.
#
# `kernel_digest` covers the release's whole `references/` set, not the
# entrypoint alone, because the Work Control Profile and the reverse-recovery
# audit are normative too. `kernel_entrypoint` must therefore name a file inside
# that same set: an entrypoint outside it could be rewritten while the checker
# reported that nothing changed. Do not compute the digest by hand: run the
# checker with the field absent and it prints
# `verify-binding:expected-digest:<value>` for the release you named.

kernel_source: iamcxa/kc-claude-plugins/kc-dev-flow
kernel_version: <installed kc-dev-flow package version>
kernel_entrypoint: references/kernel.md
kernel_digest: <the checker's expected-digest for the version above>

authority:
  project_context: <existing product and architecture sources>
  work_items: <canonical task or issue tracker>
  iteration: <canonical sprint membership and order>
  execution_state: <workflow runtime or state store>
  delivery: <authenticated delivery plus terminalization rule>
  observation: <optional ledger or metrics source, or none>
  gate_verdicts: <fresh reviewer or EM>
  scope_and_irreversibility: <captain or named authority>

upstream_contribution:
  repository: <kernel source repository>
  path: <kernel package path>
  mode: propose_only # propose_only | pull_request

adopted_controls: []

local_routes:
  normal: <repository lifecycle>
  bounded_defect: <short route or none>

local_exceptions: []
