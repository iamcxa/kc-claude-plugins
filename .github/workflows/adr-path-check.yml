name: adr-path-check

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "**/AGENTS.md"
      - "**/CLAUDE.md"
      - "docs/adr/**"
      - "scripts/adr-path-check*"
      - ".github/workflows/adr-path-check.yml"

permissions:
  contents: read

jobs:
  adr-path-check:
    name: adr-path-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: adr-path-check.test.py
        run: python3 -B scripts/adr-path-check.test.py

      - name: adr-path-check.py
        run: python3 -B -I scripts/adr-path-check.py
