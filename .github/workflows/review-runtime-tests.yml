name: kc-pr-flow typed review runtime tests

# The core suite owns append-only event integrity, safe input handling, replay,
# exact-head evidence binding, and typed decision derivation. Other review
# capabilities have separate workflows so their tests run only for their owners.

on:
  pull_request:
    paths:
      - "kc-pr-flow/scripts/review-runtime.sh"
      - "kc-pr-flow/scripts/review-runtime-safe-io.py"
      - "kc-pr-flow/scripts/review-runtime.test.sh"
      - "kc-pr-flow/test/fixtures/review-runtime/valid-events.jsonl"
      - ".github/workflows/review-runtime-tests.yml"
  push:
    branches: [main]
    paths:
      - "kc-pr-flow/scripts/review-runtime.sh"
      - "kc-pr-flow/scripts/review-runtime-safe-io.py"
      - "kc-pr-flow/scripts/review-runtime.test.sh"
      - "kc-pr-flow/test/fixtures/review-runtime/valid-events.jsonl"
      - ".github/workflows/review-runtime-tests.yml"

permissions:
  contents: read

concurrency:
  group: review-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-runtime:
    name: typed review runtime contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Require runtime tools
        run: |
          command -v bash
          command -v jq
          command -v python3
          command -v sha256sum

      - name: Run core contract
        run: bash kc-pr-flow/scripts/review-runtime.test.sh
