name: kc-pr-flow review runtime tests

# Path-filtered validation for the local typed review runtime. Keep this
# workflow non-required because path-filtered required checks can remain pending.
# The suites are deterministic and do not invoke models, the network, or GitHub.

on:
  pull_request:
    paths:
      - "kc-pr-flow/scripts/review-runtime.sh"
      - "kc-pr-flow/scripts/review-runtime-safe-io.py"
      - "kc-pr-flow/scripts/review-runtime.test.sh"
      - "kc-pr-flow/scripts/review-shadow.test.sh"
      - "kc-pr-flow/scripts/review-runtime-benchmark.sh"
      - "kc-pr-flow/scripts/review-runtime-benchmark.test.sh"
      - "kc-pr-flow/scripts/review-post.sh"
      - "kc-pr-flow/scripts/review-post.test.sh"
      - "kc-pr-flow/scripts/cross-model.sh"
      - "kc-pr-flow/scripts/cross-model.test.sh"
      - "kc-pr-flow/scripts/review-architecture-diagrams-validate.sh"
      - "kc-pr-flow/scripts/review-architecture-diagrams.test.sh"
      - "kc-pr-flow/scripts/review-architecture-diagrams-validator.test.sh"
      - "kc-pr-flow/test/fixtures/review-runtime/**"
      - "kc-pr-flow/test/fixtures/review-post/**"
      - "kc-pr-flow/skills/kc-pr-review/SKILL.md"
      - "kc-pr-flow/reference/review-runtime.md"
      - "kc-pr-flow/docs/review-runtime.md"
      - "kc-pr-flow/README.md"
      - "kc-pr-flow/CLAUDE.md"
      - "kc-pr-flow/.claude-plugin/plugin.json"
      - "kc-pr-flow/.codex-plugin/plugin.json"
      - ".claude-plugin/marketplace.json"
      - "PRODUCT.md"
      - "ARCHITECTURE.md"
      - "kc-pr-flow/test/fixtures/review-tdd-evidence/**"
      - "docs/ship-flow/tools/validate-tdd-ledger.py"
      - ".github/workflows/review-runtime-tests.yml"
  push:
    branches: [main]
    paths:
      - "kc-pr-flow/scripts/review-runtime.sh"
      - "kc-pr-flow/scripts/review-runtime-safe-io.py"
      - "kc-pr-flow/scripts/review-runtime.test.sh"
      - "kc-pr-flow/scripts/review-shadow.test.sh"
      - "kc-pr-flow/scripts/review-runtime-benchmark.sh"
      - "kc-pr-flow/scripts/review-runtime-benchmark.test.sh"
      - "kc-pr-flow/scripts/review-post.sh"
      - "kc-pr-flow/scripts/review-post.test.sh"
      - "kc-pr-flow/scripts/cross-model.sh"
      - "kc-pr-flow/scripts/cross-model.test.sh"
      - "kc-pr-flow/scripts/review-architecture-diagrams-validate.sh"
      - "kc-pr-flow/scripts/review-architecture-diagrams.test.sh"
      - "kc-pr-flow/scripts/review-architecture-diagrams-validator.test.sh"
      - "kc-pr-flow/test/fixtures/review-runtime/**"
      - "kc-pr-flow/test/fixtures/review-post/**"
      - "kc-pr-flow/skills/kc-pr-review/SKILL.md"
      - "kc-pr-flow/reference/review-runtime.md"
      - "kc-pr-flow/docs/review-runtime.md"
      - "kc-pr-flow/README.md"
      - "kc-pr-flow/CLAUDE.md"
      - "kc-pr-flow/.claude-plugin/plugin.json"
      - "kc-pr-flow/.codex-plugin/plugin.json"
      - ".claude-plugin/marketplace.json"
      - "PRODUCT.md"
      - "ARCHITECTURE.md"
      - "kc-pr-flow/test/fixtures/review-tdd-evidence/**"
      - "docs/ship-flow/tools/validate-tdd-ledger.py"
      - ".github/workflows/review-runtime-tests.yml"

permissions:
  contents: read

concurrency:
  group: review-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-runtime:
    name: typed review runtime contract
    runs-on: ubuntu-latest
    # Measured 2026-07-26: this job ran 9m07s on main against the previous
    # 10-minute cap, i.e. 53 seconds of margin, so the next change to add any
    # meaningful number of assertions was guaranteed to cancel it mid-suite --
    # and did. The suites are inherently slow (each recorded event forks python3
    # and jq), so the cap has to leave room for growth rather than track the
    # current runtime. Shrinking per-assertion cost is tracked separately.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Validate documentation safety contracts
        run: |
          grep -Fq 'Python 3.8+ providing the fail-closed safe-I/O boundary' kc-pr-flow/reference/review-runtime.md
          grep -Fq 'ShadowObservation/v1' kc-pr-flow/reference/review-runtime.md
          grep -Fq 'InteractiveCollationDecision/v1' kc-pr-flow/reference/review-runtime.md
          grep -Fq 'G1 valid bound inputs' kc-pr-flow/reference/review-runtime.md
          grep -Fq 'metadata-only quarantine' kc-pr-flow/reference/review-runtime.md
          grep -Fq 'receipt_id = sha256(run_id|review_key|content_sha256)' kc-pr-flow/reference/review-runtime.md
          grep -Fq "done < <(find \"\$STATE_ROOT\" -mindepth 4 -maxdepth 4 -type f" kc-pr-flow/docs/review-runtime.md
          grep -Fq -- "-path \"*/pr-\$PR_NUMBER/run-*/events.jsonl\" -print0)" kc-pr-flow/docs/review-runtime.md
          grep -Fq 'do not guess the newest' kc-pr-flow/docs/review-runtime.md
          grep -Fq 'uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1' .github/workflows/review-runtime-tests.yml

      # xz-utils is what unpacks the pinned ShellCheck tarball below; it is
      # present on today's runner image but installing it keeps this job from
      # depending on that.
      - name: Install shell dependencies
        run: sudo apt-get update && sudo apt-get install --yes jq xz-utils

      # Pinned by hash rather than left to apt. ShellCheck retires checks
      # between releases -- 0.11.0 dropped SC2015/SC2119/SC2120 entirely -- so
      # an unpinned runner silently changes what this gate enforces, and a
      # contributor whose local ShellCheck is newer sees files reported clean
      # that CI then rejects. Bump VERSION and SHA256 together; the
      # local-parity command lives in kc-pr-flow/CLAUDE.md. The artifact is
      # x86_64, matching this job's ubuntu-latest runner; moving to an arm64
      # runner means changing the URL and the hash together (the version guard
      # below turns a mismatch into a failed step, not a wrong lint).
      - name: Install pinned ShellCheck
        env:
          SHELLCHECK_VERSION: v0.9.0
          SHELLCHECK_SHA256: 700324c6dd0ebea0117591c6cc9d7350d9c7c5c287acbad7630fa17b1d4d9e2f
        run: |
          curl -fsSL --retry 3 \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            -o /tmp/shellcheck.tar.xz
          printf '%s  /tmp/shellcheck.tar.xz\n' "$SHELLCHECK_SHA256" | sha256sum --check --strict
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          installed="v$(shellcheck --version | awk '/^version:/ {print $2}')"
          if [ "$installed" != "$SHELLCHECK_VERSION" ]; then
            printf 'expected ShellCheck %s, got %s\n' "$SHELLCHECK_VERSION" "$installed" >&2
            exit 1
          fi
          shellcheck --version

      - name: Audit remediation evidence
        run: |
          for task in T6 T7 T8 T9 T10; do
            jq -se --arg task "$task" '
              map(select(.task_id == $task)) as $records |
              ["RED", "GREEN", "REFACTOR"] |
              map(. as $phase | $records | map(select(.phase == $phase)) | max_by(.recorded_at)) as $latest |
              ($latest | length == 3) and
              all($latest[];
                (.command | type == "string" and length > 0) and
                (.command | test("^(bash|python3)( |$)")) and
                (.command | test("benchmark\\+test|focused authority-binding|full benchmark suite|fixture JSONL audit|score twice") | not) and
                (.expected | type == "string" and length > 0) and
                (.output_excerpt | type == "string" and length > 0) and
                (.output_sha256 | type == "string" and test("^[0-9a-f]{64}$")) and
                (.recorded_at | type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$")) and
                (.exit_code | type == "number") and
                (if .phase == "RED" then .exit_code != 0 else .exit_code == 0 end) and
                .matched_expectation == true) and
              ($latest[0].recorded_at < $latest[1].recorded_at) and
              ($latest[1].recorded_at < $latest[2].recorded_at)
            ' "kc-pr-flow/test/fixtures/review-tdd-evidence/2.1-shadow-review-receipt/tdd-evidence/${task}.jsonl"
          done

      - name: Validate plan TDD ledger
        run: |
          python3 docs/ship-flow/tools/validate-tdd-ledger.py \
            --plan kc-pr-flow/test/fixtures/review-tdd-evidence/2.1-shadow-review-receipt/plan.md \
            --require-ledger-jsonl kc-pr-flow/test/fixtures/review-tdd-evidence/2.1-shadow-review-receipt/tdd-ledger.jsonl
          python3 docs/ship-flow/tools/validate-tdd-ledger.py \
            --plan kc-pr-flow/test/fixtures/review-tdd-evidence/2.2-typed-interactive-lifecycle/plan.md \
            --require-ledger-jsonl kc-pr-flow/test/fixtures/review-tdd-evidence/2.2-typed-interactive-lifecycle/tdd-ledger.jsonl

      - name: Syntax check
        run: |
          python3 -m py_compile kc-pr-flow/scripts/review-runtime-safe-io.py
          bash -n kc-pr-flow/scripts/review-runtime.sh
          bash -n kc-pr-flow/scripts/review-runtime.test.sh
          bash -n kc-pr-flow/scripts/review-shadow.test.sh
          bash -n kc-pr-flow/scripts/review-runtime-benchmark.sh
          bash -n kc-pr-flow/scripts/review-runtime-benchmark.test.sh
          bash -n kc-pr-flow/scripts/review-post.sh
          bash -n kc-pr-flow/scripts/review-post.test.sh
          bash -n kc-pr-flow/test/fixtures/review-post/stub-transport.sh

      - name: ShellCheck
        run: |
          shellcheck kc-pr-flow/scripts/review-runtime.sh
          shellcheck kc-pr-flow/scripts/review-runtime.test.sh
          shellcheck kc-pr-flow/scripts/review-shadow.test.sh
          shellcheck kc-pr-flow/scripts/review-runtime-benchmark.sh
          shellcheck kc-pr-flow/scripts/review-runtime-benchmark.test.sh
          shellcheck kc-pr-flow/scripts/review-post.sh
          shellcheck kc-pr-flow/scripts/review-post.test.sh
          shellcheck kc-pr-flow/test/fixtures/review-post/stub-transport.sh

      - name: Run runtime contract tests
        run: bash kc-pr-flow/scripts/review-runtime.test.sh

      - name: Run shadow parity tests
        run: bash kc-pr-flow/scripts/review-shadow.test.sh

      - name: Run paired benchmark tests
        run: bash kc-pr-flow/scripts/review-runtime-benchmark.test.sh

      - name: Run once-only posting tests
        run: bash kc-pr-flow/scripts/review-post.test.sh

      - name: Run compatibility regressions
        run: |
          bash kc-pr-flow/scripts/cross-model.test.sh
          bash kc-pr-flow/scripts/review-architecture-diagrams.test.sh
          bash kc-pr-flow/scripts/review-architecture-diagrams-validator.test.sh
