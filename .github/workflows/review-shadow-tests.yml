name: kc-pr-flow review shadow tests

# This suite extracts the executable adapter from kc-pr-review and proves that
# shadow mode preserves the legacy decision and GitHub-facing output.

on:
  pull_request:
    paths:
      - "kc-pr-flow/scripts/review-runtime.sh"
      - "kc-pr-flow/scripts/review-runtime-safe-io.py"
      - "kc-pr-flow/scripts/review-shadow.test.sh"
      - "kc-pr-flow/skills/kc-pr-review/SKILL.md"
      - ".github/workflows/review-shadow-tests.yml"
  push:
    branches: [main]
    paths:
      - "kc-pr-flow/scripts/review-runtime.sh"
      - "kc-pr-flow/scripts/review-runtime-safe-io.py"
      - "kc-pr-flow/scripts/review-shadow.test.sh"
      - "kc-pr-flow/skills/kc-pr-review/SKILL.md"
      - ".github/workflows/review-shadow-tests.yml"

permissions:
  contents: read

concurrency:
  group: review-shadow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-shadow:
    name: review shadow adapter parity
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Require runtime tools
        run: |
          command -v bash
          command -v jq
          command -v python3
          command -v sha256sum

      - name: Run shadow parity contract
        run: bash kc-pr-flow/scripts/review-shadow.test.sh
