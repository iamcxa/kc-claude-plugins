name: kc-dev-flow release gate

# Live multi-profile route gate: one Spacedock workflow holding a POC, a Pilot,
# and a Production item at the same time, each loading only its own contracts,
# each reaching `done` through the shared terminal path. See
# scripts/kc-dev-flow-multi-profile-gate.py for the exact claims.
#
# Deliberately NOT a required status check. It runs only on a release-please
# Release PR whose diff carries kc-dev-flow, so a required check would sit
# "pending / expected" forever on every other PR and block merges. Read its
# result before merging a kc-dev-flow Release PR; run it by hand
# (workflow_dispatch) for an out-of-band check.
#
# Cost: one ubuntu-latest job of roughly a minute, plus a ~4 MB pinned
# Spacedock download, only on release PRs that carry kc-dev-flow.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The runtime this gate's terminal claim is stated against. Bump deliberately:
  # a Spacedock that changes gate or merge-guard behavior should fail here first.
  SPACEDOCK_VERSION: v0.27.0-pre8

jobs:
  multi-profile:
    name: multi-profile route gate (live Spacedock)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.head_ref, 'release-please--branches--main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether this release carries kc-dev-flow
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          if git diff --name-only "origin/$BASE_REF"...HEAD | grep -qE '^(kc-dev-flow/|docs/dev/_mods/|scripts/kc-dev-flow-)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Release PR does not carry kc-dev-flow; nothing to gate."
          fi

      - name: Install pinned Spacedock
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          asset="spacedock_${SPACEDOCK_VERSION#v}_linux_amd64_edge.tar.gz"
          curl -fsSL -o /tmp/spacedock.tar.gz \
            "https://github.com/spacedock-dev/spacedock/releases/download/${SPACEDOCK_VERSION}/${asset}"
          tar -xzf /tmp/spacedock.tar.gz -C /tmp
          mkdir -p "$HOME/.local/bin"
          install -m 0755 /tmp/spacedock "$HOME/.local/bin/spacedock"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run the multi-profile route gate
        if: steps.scope.outputs.run == 'true'
        run: |
          spacedock --version
          ./scripts/kc-dev-flow-multi-profile-gate.py --json
