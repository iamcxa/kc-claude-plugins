name: kc-pr-flow once-only review posting tests

# The posting suite owns durable intent, exact-head invalidation, remote
# reconciliation, and the no-duplicate-review guarantee.

on:
  pull_request:
    paths:
      - "kc-pr-flow/scripts/review-runtime.sh"
      - "kc-pr-flow/scripts/review-runtime-safe-io.py"
      - "kc-pr-flow/scripts/review-post.sh"
      - "kc-pr-flow/scripts/review-post.test.sh"
      - "kc-pr-flow/test/fixtures/review-post/**"
      - ".github/workflows/review-post-tests.yml"
  push:
    branches: [main]
    paths:
      - "kc-pr-flow/scripts/review-runtime.sh"
      - "kc-pr-flow/scripts/review-runtime-safe-io.py"
      - "kc-pr-flow/scripts/review-post.sh"
      - "kc-pr-flow/scripts/review-post.test.sh"
      - "kc-pr-flow/test/fixtures/review-post/**"
      - ".github/workflows/review-post-tests.yml"

permissions:
  contents: read

concurrency:
  group: review-post-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-post:
    name: once-only review posting contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Require runtime tools
        run: |
          command -v bash
          command -v jq
          command -v python3
          command -v sha256sum

      - name: Run once-only posting contract
        run: bash kc-pr-flow/scripts/review-post.test.sh
