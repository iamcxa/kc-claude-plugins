name: Spacedock Project sync

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: spacedock-project-sync
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize reconcile receipt
        shell: bash
        run: |
          printf '%s\n' '{"schema":"spacedock-project-reconcile-result/v1","mode":"failed","error":"workflow stopped before projector result","operations":[]}' \
            > "$RUNNER_TEMP/spacedock-project-result.json"

      - name: Check out projection controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: projection-trunk

      - name: Read pinned state ref
        id: config
        shell: bash
        env:
          REPOSITORY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import urllib.request

          config = json.loads(pathlib.Path("projection-trunk/.github/spacedock-project.json").read_text())
          if config["repository"] != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("configured repository does not match workflow repository")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['REPOSITORY_TOKEN']}",
                  "X-GitHub-Api-Version": "2026-03-10",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              default_branch = json.load(response)["default_branch"]
          if config["trunk_ref"] != default_branch:
              raise SystemExit("configured trunk ref must be the repository default branch")
          if os.environ["GITHUB_REF_TYPE"] != "branch":
              raise SystemExit("dispatch this workflow from a branch")
          if os.environ["GITHUB_REF"] != f"refs/heads/{default_branch}":
              raise SystemExit("dispatch this workflow from the default branch")
          if not re.fullmatch(r"[A-Za-z0-9._/-]+", config["state_ref"]):
              raise SystemExit("configured state ref contains unsupported characters")
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"state_ref={config['state_ref']}\n")
          PY

      - name: Check out Spacedock state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.config.outputs.state_ref }}
          path: projection-state

      - name: Reconcile GitHub projection
        env:
          SPACEDOCK_REPOSITORY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPACEDOCK_PROJECT_TOKEN: ${{ secrets.SPACEDOCK_PROJECT_TOKEN }}
        run: |
          python3 projection-trunk/.github/scripts/project-spacedock-state.py reconcile \
            --config projection-trunk/.github/spacedock-project.json \
            --trunk-dir projection-trunk \
            --state-dir projection-state \
            --output "$RUNNER_TEMP/spacedock-project-result.json"

      - name: Publish reconcile receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spacedock-project-reconcile
          path: ${{ runner.temp }}/spacedock-project-result.json
          if-no-files-found: warn
