name: kc-pr-flow review plan tests

# This suite owns the read-only Phase 1 router, its sanitized shape replay, and
# the skill/reference contract that invokes it. Runtime timing and promotion
# scoring remain in their dedicated workflows.

on:
  pull_request:
    paths:
      - "kc-pr-flow/scripts/review-plan.sh"
      - "kc-pr-flow/scripts/review-plan.test.sh"
      - "kc-pr-flow/test/fixtures/review-plan/pr1693-replay.json"
      - "kc-pr-flow/scripts/review-runtime.sh"
      - "kc-pr-flow/scripts/review-runtime-safe-io.py"
      - "kc-pr-flow/skills/kc-pr-review/SKILL.md"
      - "kc-pr-flow/reference/review-triage.md"
      - "kc-pr-flow/reference/review-runtime.md"
      - ".github/workflows/review-plan-tests.yml"
  push:
    branches: [main]
    paths:
      - "kc-pr-flow/scripts/review-plan.sh"
      - "kc-pr-flow/scripts/review-plan.test.sh"
      - "kc-pr-flow/test/fixtures/review-plan/pr1693-replay.json"
      - "kc-pr-flow/scripts/review-runtime.sh"
      - "kc-pr-flow/scripts/review-runtime-safe-io.py"
      - "kc-pr-flow/skills/kc-pr-review/SKILL.md"
      - "kc-pr-flow/reference/review-triage.md"
      - "kc-pr-flow/reference/review-runtime.md"
      - ".github/workflows/review-plan-tests.yml"

permissions:
  contents: read

concurrency:
  group: review-plan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-plan:
    name: trusted review plan contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Require runtime tools
        run: |
          command -v bash
          command -v jq
          command -v python3
          command -v sha256sum

      - name: Run review plan contract
        run: bash kc-pr-flow/scripts/review-plan.test.sh
