name: e2e-pipeline tests

# Runs the portable part of the `e2e-pipeline` suite, which until now ran nowhere in CI.
#
# The gap mattered more than it looks. `docs/dev/README.md` § `done` requires "observed
# green CI for the exact HEAD" before a merge and says a passing local suite never
# substitutes. Every e2e-pipeline PR satisfied that clause against a pipeline that checked
# version parity, skill frontmatter, and dev-flow contracts and executed none of the
# suite's ~1050 assertions. The suite had only ever run on an author's machine.
#
# WHAT THIS COVERS, AND WHAT IT DOES NOT
#
# Everything except `trace-finalization.test.js`, which needs the `agent-browser` binary
# on PATH — a dependency package.json never declares (#174). That one file is the whole
# remaining exclusion.
#
# Wiring CI is what found the Linux gap in the first place. All 1055 assertions passed on
# macOS while 15 failed on the first runner execution, and each fix revealed the next
# assumption underneath:
#
#   1. the runtime refused any temp root it did not own. True of macOS per-user $TMPDIR,
#      false of Linux /tmp, which is root-owned 1777 — the standard secure arrangement.
#      Fixed in #174: the guard now tests the property it was approximating (nobody else
#      can remove or rename our entry: not group/world-writable, or sticky).
#   2. `integration.test.js` read a private corpus from an absolute path on one laptop.
#      Fixed: absent corpus skips with a reason, `E2E_CORPUS_ROOT` overrides.
#   3. `trace-finalization.test.js` resolves `agent-browser` from PATH. Still open.
#
# Excluding that last file is deliberate rather than papered over with an install step: a
# permanently red check trains everyone to ignore CI, and installing a browser driver to
# satisfy a test that should be stubbing it would hide the undeclared dependency instead
# of fixing it.
#
# NOT A REQUIRED CHECK YET. Let it accumulate runs on this runner before promotion in
# branch protection, and record that promotion rather than leaving it to memory.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: e2e-pipeline

jobs:
  suite:
    name: e2e-pipeline suite (portable)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e-pipeline/package-lock.json

      - name: Install
        run: npm ci

      - name: Run suite
        env:
          # Satisfies the runtime's user-owned-temp-root requirement rather than relaxing
          # the check. Only some of the excluded files need it, but the rest of the suite
          # writes scratch directories too and a runner-owned root is correct for all of
          # them.
          TMPDIR: ${{ runner.temp }}
        # The exclusion list is spelled out in the command rather than hidden in a glob so
        # the log shows which files were skipped and why the count differs from `npm test`.
        run: |
          set -euo pipefail
          excluded='trace-finalization'
          mapfile -t files < <(ls compiler/test/*.test.js | grep -vE "$excluded")
          echo "running ${#files[@]} of $(ls compiler/test/*.test.js | wc -l) test files"
          echo "excluded (needs agent-browser on PATH — see #174): $excluded"
          node --test "${files[@]}"
