name: e2e-pipeline tests

# Runs the portable part of the `e2e-pipeline` suite, which until now ran nowhere in CI.
#
# The gap mattered more than it looks. `docs/dev/README.md` § `done` requires "observed
# green CI for the exact HEAD" before a merge and says a passing local suite never
# substitutes. Every e2e-pipeline PR satisfied that clause against a pipeline that checked
# version parity, skill frontmatter, and dev-flow contracts and executed none of the
# suite's ~1050 assertions. The suite had only ever run on an author's machine.
#
# WHAT THIS COVERS
#
# The whole suite. There is no exclusion list any more (#174).
#
# Wiring CI is what found the Linux gap in the first place. All 1055 assertions passed on
# macOS while 15 failed on the first runner execution, and each fix revealed the next
# assumption underneath:
#
#   1. the runtime refused any temp root it did not own. True of macOS per-user $TMPDIR,
#      false of Linux /tmp, which is root-owned 1777 — the standard secure arrangement.
#      Fixed in #174: the guard now tests the property it was approximating (nobody else
#      can remove or rename our entry: not group/world-writable, or sticky).
#   2. `integration.test.js` read a private corpus from an absolute path on one laptop.
#      Fixed: absent corpus skips with a reason, `E2E_CORPUS_ROOT` overrides.
#   3. `trace-finalization.test.js` was recorded as needing `agent-browser` on PATH. It
#      does not. Two of its Teams tests set only `AGENT_BROWSER_BIN`, and the owned-runtime
#      path deliberately reads `E2E_AGENT_BROWSER_BIN` instead, so they reached whatever
#      real binary the author had installed. Fixed by giving those two the stub the rest
#      of the file already uses. The suite does shell out to `zip`, which macOS and
#      `ubuntu-latest` both provide.
#   4. `runtime-state-finalizer.test.js` used `stat -f '%Lp' || stat -c '%a'` to read a
#      mode. On GNU coreutils `-f` means --file-system and takes no argument, so the
#      format string is read as a second operand: stat errors on it, prints a filesystem
#      report for the real path, and exits 1. The `||` fallback runs, but its output is
#      already prefixed by that report, so the captured value never equalled `700`.
#      Fixed by trying GNU first.
#
# None of the four was a defect in the shipped runtime except (1). Three were assumptions
# the author's machine happened to satisfy.
#
# NOT A REQUIRED CHECK YET. Let it accumulate runs on this runner before promotion in
# branch protection, and record that promotion rather than leaving it to memory.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: e2e-pipeline

jobs:
  suite:
    name: e2e-pipeline suite (portable)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e-pipeline/package-lock.json

      - name: Install
        run: npm ci

      - name: Run suite
        # TMPDIR is deliberately NOT overridden. An earlier revision pointed it at
        # `runner.temp` to satisfy the old user-owned-temp-root guard; #174 fixed that
        # guard to test the actual property, so `/tmp` is accepted on its own merits and
        # the override became harmful — `/home/runner/work/_temp` is long enough that the
        # derived agent-browser socket path exceeds the ~104-byte Unix domain socket
        # limit, which failed 30 tests. A workaround that outlived its cause.
        #
        # The exclusion list lives in `package.json` rather than here, so the tier a PR is
        # judged by is the same command an author can run locally. It was bash in this
        # file first, which meant the gate's definition existed only in CI.
        run: npm run test:ci
