name: e2e-pipeline tests

# Runs the portable part of the `e2e-pipeline` suite, which until now ran nowhere in CI.
#
# The gap mattered more than it looks. `docs/dev/README.md` § `done` requires "observed
# green CI for the exact HEAD" before a merge and says a passing local suite never
# substitutes. Every e2e-pipeline PR satisfied that clause against a pipeline that checked
# version parity, skill frontmatter, and dev-flow contracts and executed none of the
# suite's ~1050 assertions. The suite had only ever run on an author's machine.
#
# WHAT THIS COVERS, AND WHAT IT DOES NOT
#
# 925 of 1055 assertions: parser, resolver, compiler, codegen, selector policy and grammar
# gate, visibility probe and contract, quarantine, metrics, migrate, CLI, issue promotion.
# That is the regression surface for five of the six issues in sprint S2.
#
# Three files are excluded because they do not run on a clean Linux host at all:
#
#   browser-runtime-lifecycle.test.js   27 failures
#   trace-finalization.test.js           3
#   runtime-state-finalizer.test.js      3
#
# Wiring CI is what found that. All 1055 pass on macOS; on the first runner execution 15
# failed, and each fix revealed the next assumption underneath:
#
#   1. the runtime refuses a temp root it does not own — true of macOS per-user $TMPDIR,
#      false of Linux /tmp, which is root-owned
#   2. `integration.test.js` read a private corpus from an absolute path on one laptop
#      (fixed here: absent corpus now skips with a reason, `E2E_CORPUS_ROOT` overrides)
#   3. the suite needs the `agent-browser` binary on PATH, which package.json never
#      declares
#
# (1) and (3) are product facts, not test bugs: the browser runtime as shipped cannot run
# on an ordinary Linux box. Porting it is its own work and is filed separately. Excluding
# those three files here is deliberate — a permanently red check trains everyone to ignore
# CI, which costs more than the coverage it pretends to give. A smaller gate that is
# actually trustworthy beats a larger one nobody believes.
#
# NOT A REQUIRED CHECK YET. Let it accumulate runs on this runner before promotion in
# branch protection, and record that promotion rather than leaving it to memory.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: e2e-pipeline

jobs:
  suite:
    name: e2e-pipeline suite (portable)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e-pipeline/package-lock.json

      - name: Install
        run: npm ci

      - name: Run suite
        env:
          # Satisfies the runtime's user-owned-temp-root requirement rather than relaxing
          # the check. Only some of the excluded files need it, but the rest of the suite
          # writes scratch directories too and a runner-owned root is correct for all of
          # them.
          TMPDIR: ${{ runner.temp }}
        # The exclusion list is spelled out in the command rather than hidden in a glob so
        # the log shows which files were skipped and why the count differs from `npm test`.
        run: |
          set -euo pipefail
          excluded='trace-finalization|browser-runtime-lifecycle|runtime-state-finalizer'
          mapfile -t files < <(ls compiler/test/*.test.js | grep -vE "$excluded")
          echo "running ${#files[@]} of $(ls compiler/test/*.test.js | wc -l) test files"
          echo "excluded (do not run on a clean Linux host — see workflow header): $excluded"
          node --test "${files[@]}"
