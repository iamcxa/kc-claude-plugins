name: marketplace version parity

# Asserts every plugin's version is consistent across all tracked sources and
# validates that every release-please extra-file resolves to exactly one target:
#   release manifest == plugin.json == marketplace.json entry
#                                   == .codex-plugin/plugin.json (when tracked)
# Also asserts every skills/*/SKILL.md has a well-formed frontmatter block with
# a non-empty name and description (see scripts/skill-frontmatter-lint.sh).
#
# Catches invalid extra-file paths before release and half-published bumps where
# the release manifest changes but a plugin / marketplace / Codex manifest is
# left stale. The only fetched test dependency is the exact release-please
# version paired with the pinned release action; no `claude` CLI is required.
#
# Runs on EVERY pull request — intentionally no `paths:` filter. This is the
# required status check on `main`: a required check that a path filter skips
# stays "pending / expected" forever and blocks unrelated PRs from merging.
# Always running it is the correct pattern for a required gate.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  parity:
    # Keep this legacy context name stable because branch protection requires it.
    name: version parity (plugin.json / marketplace.json / codex / README)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release config, first-release contract, and version parity
        run: |
          ./scripts/release-metadata.test.sh
          ./scripts/version-parity-check.sh

      - name: Validate skill frontmatter
        run: |
          ./scripts/skill-frontmatter-lint.test.sh
          ./scripts/skill-frontmatter-lint.sh

      - name: Validate packaged release helpers
        run: |
          ./kc-plugin-forge/scripts/plugin-release-contract.test.sh
          ./kc-plugin-forge/scripts/plugin-release-contract-check.sh --repo .

      - name: Validate dev-flow work-context adapter
        run: ./scripts/dev-flow-work-context-check.test.sh

      - name: Validate portable dev-flow product contract
        run: ./scripts/kc-dev-flow-contract-test.py
