name: marketplace version parity

# Asserts every plugin's version is consistent across all sources:
#   plugin.json (canonical) == marketplace.json entry
#                           == .codex-plugin/plugin.json (when git-tracked)
#                           == README badge (### [<plugin>](...) `vX.Y.Z`)
#
# Catches the half-published version bump where plugin.json is bumped but the
# marketplace entry / README badge / Codex manifest are left stale (the
# kc-marketplace-sync Steps 1.5 + 2 are prose-level and easy to skip). Cheap —
# python3 + grep only, no `claude` CLI.
#
# Runs on EVERY pull request — intentionally no `paths:` filter. This is the
# required status check on `main`: a required check that a path filter skips
# stays "pending / expected" forever and blocks unrelated PRs from merging.
# Always running it (≈7s) is the correct pattern for a required gate.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  parity:
    name: version parity (plugin.json / marketplace.json / codex / README)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check version parity
        run: ./scripts/version-parity-check.sh
