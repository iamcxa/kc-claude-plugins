# Fictional teaching fixture: proposed book pickup, not implemented behavior.
# All stories are unverified; system and function fields are authored intent.

journey: book-pickup
title: "Illustrative book pickup — fictional"
persona: "A reader collecting a reserved book from a neighborhood library."
one_journey: "Reserve a book, learn when it is ready, and collect it at the desk."

steps:
  - id: reserve
    card: "Chooses a book to collect"
    activity: "Reserve a book"
    stories:
      - {id: reserve-copy, card: "Reserve a copy for pickup", release: r1, status: unverified}
      - {id: choose-pickup-day, card: "Choose a convenient pickup day", release: r2, status: unverified}
    system: ["Proposed: record a reservation when a copy can be held."]
    rules: [one-active-hold]
    command: "ReserveBook(reader, book)"
    events: ["BookReserved", "ReservationRefused"]
    state: "The reader's active reservation"
    readmodel: "Reservation confirmation"

  - id: ready
    card: "Checks whether the book is ready"
    activity: "Know when to visit"
    stories:
      - {id: check-ready, card: "See that the book is ready to collect", release: r1, status: unverified}
      - {id: receive-reminder, card: "Receive a reminder before the hold expires", release: r2, status: unverified}
    system: ["Proposed: show the pickup location and hold deadline after staff prepare the book."]
    rules: [hold-deadline]
    command: "MarkBookReady(reservation)"
    events: ["BookReady", "PreparationRefused"]
    state: "Reservation readiness and hold deadline"
    readmodel: "Pickup details"

  - id: collect
    card: "Collects the book at the desk"
    activity: "Take the book home"
    stories:
      - {id: collect-book, card: "Collect the reserved book", release: r1, status: unverified}
    system: ["Proposed: confirm the reservation before recording collection."]
    rules: [hold-deadline]
    command: "CollectBook(reservation)"
    events: ["BookCollected", "CollectionRefused"]
    state: "Reservation completion"
    readmodel: "Collection receipt"

releases:
  - {id: r1, name: "RELEASE 1 — Reserve and collect", goal: "A reader can reserve a book, check readiness and collect it."}
  - {id: r2, name: "RELEASE 2 — Plan the visit", goal: "A reader can choose a pickup day and receive a reminder."}

rules:
  - {id: one-active-hold, text: "Proposed: a reader may hold one active reservation per book."}
  - {id: hold-deadline, text: "Proposed: show the hold deadline before the reader travels to collect the book."}

status:
  unproven: "Fictional teaching model: every story is unverified; no user exercise or code evidence is claimed."
  unmerged: "Illustrative intent only; no implementation or repository merge state is asserted."
  undeployed: "No library service or deployed behavior is represented."
  irreversible: "The example creates no real reservations or loans."
