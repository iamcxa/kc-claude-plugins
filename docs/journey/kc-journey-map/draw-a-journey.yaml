            ask: Which host obligations must match while keeping Cloudflare Free?
            answer: >-
              Preserve the shared document/admission/lifecycle/error contract and explicit host capability differences. Cloudflare must stay Free; actual account eligibility, sockets/alarms/reads/writes/CPU/storage and representative workload remain unmeasured local-only proof. No paid upgrade or automatic scope expansion.
              local review record: interrogation-v2-triage.md#theme-16 (not published)
    system:
