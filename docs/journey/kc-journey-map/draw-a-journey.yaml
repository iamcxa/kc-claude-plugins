releases:
  - id: r1
    name: RELEASE 1
    goal: A person can draw a story map by talking, and plan with it.
  - id: r2
    name: RELEASE 2
    goal: The same map can be checked against the code that exists.
  - id: r3
    name: RELEASE 3
    goal: Author a function model, iterate on it quickly, and hand one agreed Development Brief to
      development planning.
  - id: r4-entry
    name: Private entry foundation · MERGED · DEFAULT OFF
    goal: A preconfigured verified human opens the exact permitted synthetic room locally; the merged
      foundation stays disabled.
  - id: r4-catalog
    name: Choose another permitted room · MERGED · DEFAULT OFF
    goal: A preconfigured human switches between permitted synthetic rooms and keeps the source editor
      on failure.
  - id: r4-account
    name: See My account and log out · ACCEPTED SLICE 2b
    goal: A signed-in human opens the native 「我的帳號」 view and explicitly logs out safely, retaining
      unconfirmed work and a clear path to sign in again.
  - id: r5-pair-and-stop
    name: Pair and revoke one agent safely · ACCEPTED SLICE
    goal: A verified human pairs one exact installation, then revokes it while other authorized actors
      continue.
  - id: r4-return-and-recover
    name: Return to work and recover safely · ACCEPTED SLICE
    goal: The same human returns to the permitted room and explicitly restores an acknowledged draft
      after access recovery.
  - id: r5-coedit
    name: Human and native agents coedit · ACCEPTED SLICE
    goal: A human and separate Claude and Codex installations edit one permitted room, with attribution
      and second-room refusal.
  - id: r7-members
    name: Enroll one private member · ACCEPTED SLICE
    goal: The private operator enrolls one verified recipient into exactly the approved existing rooms
      and receives a truthful result.
  - id: r7-native-controls
    name: Use native account controls · ACCEPTED SLICE
    goal: A human manages own agents and reads guarded current-room membership inside the native canvas,
      preserving the earlier account/logout slice.
  - id: r7-host-parity
    name: Accept the journey on both hosts · ACCEPTED SLICE
    goal: The accepted private journey behaves consistently on local Node and a bounded Cloudflare Free
      installation.
  - id: r7-setup
    name: Set up Cloudflare with one command · ACCEPTED SLICE
    goal: The owner previews and authorizes one supported setup command that returns a usable private
      entry and safe rerun/cleanup results.
ownership:
  - id: own-author
    owner: The engineer
    from: write
    to: write
    note: owns the claims, the citations and the model
  - id: own-tool
    owner: The skill
    from: render
    to: readback
    note: owns the drawing, the contract, the lint and the read-back
rules:
  - id: file-is-truth
    text: The file in the repository is the source of truth; every board or document is generated from it
  - id: board-is-a-cache
    text: Read or export canvas edits before rerendering; the room is a projection of the journey file
  - id: handmade-cards-survive
    text: A shape with no meta.journey is never touched by a re-render, and is reported as unclaimed
  - id: no-cell-from-memory
    text: Every System Flow cell cites something read this session; a recalled fact is a hypothesis
  - id: contract-is-generated
    text: The per-release contract is generated from the journey file on every run; there is no
      hand-edit path
  - id: grep-is-the-check
    text: A lint that can be made to fire on a real defect is a check; one that cannot is decoration
  - id: share-is-not-read-only
    text: The shared front-end syncs over the same /connect/ channel the canvas uses; a link holder
      edits the board
  - id: link-dies-with-the-process
    text: A quick tunnel's hostname cannot be chosen and is not reused; every restart invalidates a link
      already sent
  - id: lossy-inverse
    text: Lane 2 and lane 3 have no honest inverse — canvas text cannot be mapped back to a rule id
  - id: ambiguity-refused
    text: tldraw copies meta verbatim on duplicate, so a duplicated nodeId refuses the whole reorder
  - id: model-is-written-not-derived
    text: A function map is written by a person reading the code, not transformed out of prose by the
      tool
  - id: same-columns-new-lanes
    text: The function map keeps the journey's columns and swaps the lanes; it is not a second tool
  - id: events-carry-order
    text: Event order is authored modeling input; the projection does not infer causality or build order
  - id: selection-is-per-call
    text: Which projections a render draws is chosen per call, never stored in the journey file — the
      same file renders one way for a stand-up and another for a release review
  - id: r3-feedback-measurement
    text: "R3 direction: keep an existing compatible server running; never stop a non-owned server for
      cleanup. Full request-to-visible-link timing and compatibility detection remain unverified;
      baseline and target are unset. The POC does not justify renderer optimization."
  - id: r3-model-authoring
    text: Author the model in the source; a standalone handler is not required. Edit then redraw; direct
      function-map canvas writeback stays deferred. Event order alone does not establish causality
      or a build schedule.
  - id: r3-handoff-authority
    text: Dev-flow owns technical shaping once, under existing profile/admission authority. No automatic
      task creation or scheduling; task counts do not prove a story exists or a journey is accepted.
  - id: private-entry-identity
    text: Verify provider identity before app-member binding. Browser cookie, agent credential and
      deployment token are distinct. Never log credentials.
  - id: private-room-data
    text: Keep A, B and qnow-day2 ids and all data. Old links and switching never copy, clear or replace
      documents.
  - id: private-room-selection
    text: "Accepted entry rule: explicit URL room first; otherwise resume the last-worked
      still-permitted room. First use or ineligible remembered room shows available-room selection.
      An explicit unauthorized URL shows recovery without automatic room substitution. Recheck
      current permission; no A default."
  - id: private-failure-visible
    text: Show requested room and safe recovery after failure. No false connected/saved claim. Recheck
      access on return.
  - id: private-agent-boundary
    text: Agent rooms intersect current authorizer grants and delegated grants; expiry/revoke/disable
      deny reads and writes. Denied operations change nothing.
  - id: private-scope
    text: The 2026-10-19 four-slice design is historical scope. The Captain accepted the nine finer
      private slices plus account/logout slice 2b, ordered after catalog and before pairing.
      Preserve room engine/data/concurrency, Free-only hosting and local-only usage detail. Entry
      and catalog are merged; each later slice needs current-main integration proof. Development
      admission, hosted acceptance and activation remain separate decisions.
  - id: private-member-enrollment
    text: |
      Only the owner or an explicitly authorized assistant may use the private management command
      to add the specified email/member and explicit existing-room permissions. Email-code login
      verifies the recipient; provider allowlisting alone is not application enrollment. Ordinary
      members and agent families gain no administrative authority. No sharing UI, public invitation
      endpoint, re-enable, new per-action permission model or canvas/data/concurrency change.
status:
  unproven: "2026-11-05: nine accepted private slices plus account/logout slice 2b are mapped in
    order. Only entry and catalog have implementation evidence on origin/main 8dc13b6. Later private
    stories retain proposal gap/unverified status; six r3 stories remain unverified. Stale legacy
    symbols systemText, ruleText and startTunnel are downgraded to unverified as in the reviewed
    proposal. This map update runs source lint only, with no canvas or runtime acceptance. Local
    code existence does not establish hosted provider login, stream-stop safety, secure installation
    storage, draft recovery, physical-device use or Free-plan workload acceptance. Fit/appetite and
    per-slice development admission are separate."
  unmerged: "Entry slice 1 and catalog slice 2 are on origin/main 8dc13b6 via #778 and #779.
    Account/logout slice 2b and all remaining private slices are not established on main; historical
    stacked branches are source material, not independently validated landable heads. This docs
    branch is a local-only commit for FO review, with no push or pull request."
  undeployed: Human entry remains opt-in/default off. Historical implementation-25 proved two email
    identities only; implementation-36 reached root/assets/config and login UI without human canvas
    acceptance, and its cleanup record reports temporary resource removal. This map update performs
    no deployment, provider/account change or activation and claims no current hosted acceptance.
  irreversible: Deleting a room loses unexported native edits. Read back edits or export a .tldr
    backup first; generated contracts can be rebuilt.
  as_of: 2026-11-05
