# Canonical private-slice plan; accepted design: private-entry.md; boundaries updated 2026-11-05.
# Question answers are accepted design dispositions, never runtime passes.
journey: draw-a-journey
title: Draw a map with this skill
measured:
  ref: "Historical example observation: branch iamcxa/journey-map-skill-merge, PR #394"
  date: 2026-09-10
  repos:
    - kc-claude-plugins
persona: >
  An engineer who has to say what a system does today, and be believed — and then say which part to
  build next.
one_journey: >
  An engineer writes one journey file, and every board, contract and lint they see is generated from
  it — with authored intent and evidence kept in the file.
now:
  - id: now-prose
    card: Writes the flow as prose in a doc
    pain: no column forces the evidence next to the claim
  - id: now-whiteboard
    card: Draws it on a whiteboard
    pain: goes stale the day it is drawn, and nothing says so
    workaround: re-draws it before each review
  - id: now-taste
    card: Splits the work into tickets by feel
    pain: the split is defensible only by whoever made it
steps:
  - id: write
    card: Writes the steps and the evidence into a file
    activity: Write the journey
    stories:
      - id: name-the-steps-a-person-take
        card: Name the steps a person takes
        release: r1
        status: exists
        evidence: loadModel
      - id: cite-the-code-each-step-runs
        card: Cite the code each step runs
        release: r2
        status: unverified
      - id: name-what-must-stay-true
        card: Name what must stay true
        release: r2
        status: unverified
    system:
      - docs/journey/<slug>.yaml in the repository being described — steps, rules, slices, status
      - "No coordinates are stored: layout is computed from order, so a move is a one-line diff"
    cites:
      - kc-claude-plugins
    rules:
      - file-is-truth
      - no-cell-from-memory
  - id: render
    card: Renders the selected boards
    activity: Put it on a board
    stories:
      - id: ask-which-boards-to-draw
        card: Ask which boards to draw, through the host's selection UI
        release: r1
        status: exists
        evidence: buildAllPages
      - id: default-to-the-journey-alone
        card: Get the user journey alone when nobody answers
        release: r1
        status: exists
        evidence: DEFAULT_PROJECTIONS
      - id: draw-the-journey-board-if-ask
        card: Draw the per-release journey board, but only if asked for it
        release: r1
        status: exists
        evidence: buildJourneyBoard
      - id: get-a-story-map-and-an-journ
        card: Get a story map, rendered to canvas
        release: r1
        status: exists
        evidence: buildStoryMap
      - id: re-render-after-every-change
        card: Re-render after every change
        release: r1
        status: exists
        evidence: renderToRoom
      - id: export-an-image-for-a-report
        card: Export an image for a report
        release: r1
        status: exists
        evidence: toImage
      - id: see-updated-map-without-waiting
        card: See the updated map quickly after each discussion change
        release: r3
        status: unverified
    system:
      - "Current: buildAllPages/renderToRoom batch chosen projections in one PATCH; journey-board
        includes all releases."
      - "R3 direction: show the verified live board first; reuse an existing compatible server.
        Export PNGs on user request or when justified by the conversation context."
    cites:
      - kc-claude-plugins
    rules:
      - board-is-a-cache
      - handmade-cards-survive
      - selection-is-per-call
      - r3-feedback-measurement
    command: RenderJourney(journeyFile, roomId, selection)
    events:
      - ShapesUpserted
      - OwnedShapesRemoved
      - RecordRejected
    state: the room document
    readmodel: the story map a person looks at
    note: >
      R1: scoped Codex Plan-mode selection and Default-mode rendering were verified; see README.md.
      buildAllPages supports rendering, not host-UI proof. Native multi-select, Default-mode async
      UI and other hosts remain unverified.
  - id: contract
    card: Generates a per-release contract alongside the boards
    activity: Check it against the code
    stories:
      - id: generate-a-contract-per-release
        card: Generate a per-release contract, never authored by hand
        release: r2
        status: exists
        evidence: buildReleaseContract
      - id: run-three-lints-that-can-fail
        card: Run status and evidence lints, each shown firing on a real defect
        release: r2
        status: exists
        evidence: lintJourney
    system:
      - "lib/release-contract.mjs -> one document per release: each story's status, evidence symbol
        and rule ids"
      - lib/lint.mjs -> no-status, invalid-status, exists-without-evidence, evidence-not-found; the
        last re-greps the repository every run
    cites:
      - kc-claude-plugins
    rules:
      - contract-is-generated
      - grep-is-the-check
    command: LintJourney(journeyFile, repoRoot)
    events:
      - ContractGenerated
      - LintPassed
      - LintViolationFound
    state: nothing — the file is the only state; the contract and the lint result are both derived
    readmodel: the release contract document, and the lint's violation list
  - id: share
    card: Puts the board in front of someone who has no checkout
    activity: Let someone else in
    stories:
      - id: hand-someone-a-link-to-board
        card: Hand someone a link to the board
        release: null
        status: unverified
      - id: share-without-edit-rights
        card: Let them read it without handing over edit rights
        release: null
        status: gap
      - id: know-a-link-i-sent-has-died
        card: Know that a link I already sent has stopped working
        release: null
        status: gap
    system:
      - server/tunnel.ts -> a cloudflared quick tunnel onto JOURNEY_SHARE_PORT; the canvas API is
        deliberately never the target
      - vite.share.config.mts proxies /connect/ and /uploads/ only; every other path returns the SPA
        shell
      - server/client/App.tsx takes the room from ?room= and falls back to a room named default
      - tunnelStatus reports running from the child process and targetUp from a socket to the
        target; neither observes the public URL
    cites:
      - kc-claude-plugins
    rules:
      - share-is-not-read-only
      - link-dies-with-the-process
  - id: enroll-private-member
    card: Owner adds a person to specified private rooms
    activity: Let a specified person in
    stories:
      - id: add-private-member-with-room-grants
        card: Add a specified email with explicit room permissions
        release: r7-members
        status: unverified
        questions:
          - id: q-member-enrollment-operator-proof
            ask: Who may run the command, and how is delegated operator authority proved?
          - id: q-member-enrollment-identity-binding
            ask: How does verified email bind to one immutable provider subject?
          - id: q-member-enrollment-commit-receipt
            ask: What receipt proves the exact member, backend, rooms and grant outcome?
    note: "Accepted slice r7-members (Enroll one private member): private-member-enrollment. Dependencies:
      r5-pair-and-stop, r4-return-and-recover. Source private-member-enrollment; equivalent patches
      in private-host-parity; commits b06be1b, d56f979, 3cff098, e2dd24e, 530c876, 04a712e. Local
      signed-provider fixtures, created/unchanged/conflict/unknown, atomic rollback, restart and
      ordinary-member/agent denial. Real recipient email-code login and grants require later bounded
      cloud acceptance. Earlier two-email identity-only success is narrower evidence.
      Removal/deferral test: No invitation UI, automatic first-login grants, reenable, room creation
      or operator promotion. The CLI recipient needs no terminal."
    rules:
      - private-entry-identity
      - private-room-data
      - private-agent-boundary
      - private-member-enrollment
      - private-scope
    system:
      - Candidate scope only; current-main delivery is not established. See the named task Scope,
        Acceptance criteria and latest Stage Report summary in docs/dev2/.spacedock-state/.
  - id: setup-private-host
    card: Sets up the private host
    activity: Prepare my private canvas
    stories:
      - id: set-up-cloudflare-with-one-command
        card: Set up a private Cloudflare canvas with one command
        release: r7-setup
        status: gap
        questions:
          - id: q-setup-execution-boundary
            ask: Accept a separately scoped installer after hosted journey proof?
    system:
      - "Design only: private-native-ui-deploy-design/design/deploy-design.md and AC-2;
        implementation-36/next-cloud-proposal.md describes a bounded one-use test harness, not a
        consumer setup command."
    rules:
      - private-entry-identity
      - private-room-data
      - private-agent-boundary
      - private-scope
    note: "New implementation: offline exact payload/routing and credential-boundary tests, then
      separately authorized fresh/repeated/partial-failure cloud setup plus human entry and
      exact-owned cleanup. The round36 one-use harness is not a shipped installer."
  - id: private-entry
    card: Signs in and enters the intended private canvas
    activity: Enter my private canvas
    stories:
      - id: land-on-the-board-i-shared
        card: Have them land on the board I shared, not an empty one
        release: r4-entry
        status: exists
        questions:
          - id: q-r4-no-room-choice
            ask: With no room requested, should entry restore the last permitted room or use a configured first
              room?
            answer: >-
              Explicit URL first; otherwise resume only the same member’s still-permitted last room. Recheck current policy before opening.
              local review record: adr/LOCAL-entry-room-priority.md#decision (not published)
          - id: q-r4-no-eligible-history
            ask: On first use or no eligible history, accept a permitted-room chooser with no automatic A
              default?
            answer: >-
              Show the registered permitted-room chooser on first use or stale history. Empty inventory stays stopped; no automatic default.
              local review record: adr/LOCAL-entry-room-priority.md#first-use-and-denied-target-ruling (not published)
          - id: q-r4-legacy-day2-data
            ask: Must old Day2 links keep the existing qnow-day2 canvas?
            answer: >-
              Preserve the original qnow-day2 ID, records and links. No replacement, copy, clear, implicit empty creation or data migration.
              local review record: interrogation-v2-triage.md#theme-07 (not published)
        evidence: registeredHumanRoom
    system:
      - "Current main: server/host/human.ts humanRoute handles /auth/entry;
        humanFromHeaders/currentHuman verify the human session and registeredHumanRoom requires the
        exact currently permitted registered room before document admission."
      - "Current main: server/host/transport.ts handle routes humanRoute before document
        operations; server/host/human-provider.ts verifyCloudflareIdentity validates signed provider
        identity. Human entry remains opt-in and default off."
    cites:
      - kc-claude-plugins
    rules:
      - private-entry-identity
      - private-room-selection
      - private-scope
    note: "Slice 1 (r4-entry), merged via #778. The original room IDs/data and existing
      write/concurrency rules are preserved. registeredHumanRoom is implementation evidence on main;
      historical local Node/Worker proofs do not establish hosted provider acceptance, stream safety
      or activation. Catalog is the separately merged slice 2; return/drafts and agents remain later
      work."
  - id: choose-private-room
    card: Chooses another permitted room from the canvas
    activity: Choose my room
    stories:
      - id: switch-my-permitted-rooms
        card: Switch my permitted rooms without leaving the canvas
        release: r4-catalog
        status: exists
        questions:
          - id: q-r4-fourth-room-registration
            ask: Which existing registration procedure can add a permitted fourth room without a new frontend
              path or build?
            answer: Operator registration and an exact member-room grant make an existing room eligible without
              a new frontend build. Catalog reads metadata, not document telemetry.
          - id: q-r4-partial-catalog-failure
            ask: Can an expired Day2 credential disable otherwise valid A and B?
            answer: >-
              Independent room grants remain independent. One expired room cannot disable valid rooms; policy/service failure stays explicit and fails closed.
              local review record: interrogation-v2-triage.md#theme-05 (not published)
          - id: q-r4-switch-failure
            ask: Which original context survives denied source confirmation, a failed target or concurrent
              coediting?
            answer: >-
              Confirm source edits before switching; retain the original editor on failed confirmation or target admission. A denied URL never selects another room automatically. Revoked-source work stays frozen; another room requires an explicit new context.
              local review record: interrogation-v2-triage.md#theme-04 (not published)
        evidence: permittedRoomCatalog
    system:
      - "Current main: server/host/human.ts permittedRoomCatalog serves /auth/rooms from registered
        room metadata intersected with current human grants; it does not read documents or sample
        health."
      - "Current main: server/client/RoomSelector.tsx RoomPageMenu renders the native room menu;
        App.tsx stages target sync after confirmRoomSwitch, retains the source editor on failure,
        and changes URL/history only after successful target activation."
    cites:
      - kc-claude-plugins
    rules:
      - private-room-data
      - private-room-selection
      - private-scope
    note: "Slice 2 (r4-catalog), merged via #779. permittedRoomCatalog is implementation evidence on
      main. Local catalog/switching evidence remains narrower than hosted or human journey
      acceptance. Keep source edits on failed or stale confirmation; denied source work stays frozen
      and an explicit separate context can open another room. Default-off human entry remains
      unchanged. Slice 2b adds only native account view/logout before safe pairing."
  - id: return-private-room
    card: Returns to the same permitted room
    activity: Return to my work
    stories:
      - id: resume-my-authorized-room
        card: Return to my room after reload or sign-in
        release: r4-return-and-recover
        status: unverified
        questions:
          - id: q-r4-unsent-work-boundary
            ask: Do unconfirmed edits survive reload or have a guaranteed hosted export?
            answer: >-
              Human browser drafts are accepted, separate from sync and agent process state. Only acknowledged durable browser saves may claim local persistence; hosted export is not guaranteed. Explicit verified restoration never silently overwrites cloud data.
              local review record: design-brief.md#accepted-human-local-draft-direction (not published)
          - id: q-r4-history-isolation
            ask: Whose last-worked room is remembered across tabs and accounts, and when is it updated?
            answer: >-
              History is local to origin/backend/member. Update it only after successful exact-room admission; stale, denied or different-member history cannot substitute a room.
              local review record: interrogation-v2-triage.md#theme-06 (not published)
          - id: q-draft-local-ack
            ask: Which human edits survive reload, tab close or crash, and what happens when browser persistence
              fails or disappears?
            answer: >-
              Persist immutable human draft versions in IndexedDB transactions and acknowledge only after durable completion. Failed saves retain the open tab and show failure; eviction/private browsing/clearing remain explicit limits. No time expiry: retain until verified restore plus cloud sync or manual deletion.
              local review record: design-brief.md#accepted-human-local-draft-direction (not published)
          - id: q-draft-identity-recheck
            ask: Who may discover, review and restore a local draft after account/room change, revocation or
              later regrant?
            answer: >-
              Before draft discovery/review and again before apply, require the original verified person/backend/room and current permission. Regrant allows explicit review only, never automatic resume or cloud write. A changed shared cookie cannot reconnect the old context.
              local review record: design-brief.md#accepted-human-local-draft-direction (not published)
          - id: q-draft-multitab-isolation
            ask: How do multiple browser tabs preserve distinct acknowledged draft versions without
              cross-account leakage or overwriting one another?
            answer: >-
              Use immutable backend/member/room/tab/version keys and atomic head updates. Separate tabs retain distinct versions; metadata discovery never grants access. Do not merge or overwrite other tabs/accounts.
              local review record: design-brief.md#accepted-human-local-draft-direction (not published)
          - id: q-draft-apply-receipt
            ask: How can explicit restoration handle changed cloud data or a partial/lost apply response without
              silent overwrite, duplicate retry or premature cleanup?
            answer: >-
              Compare reviewed base/selected fingerprints with current cloud state before explicit apply. Keep an attempt receipt and retain every draft on unknown or partial result; reconcile readback before retry. Remove only the exact version after verified restoration and cloud sync, or manual deletion.
              local review record: design-brief.md#accepted-human-local-draft-direction (not published)
    system:
      - "Current: server/client/App.tsx room navigation and confirm-room-switch.ts compare the
        local/remote document before leaving."
      - "Proposed: pause writes on session expiry; retain original tab; separate reauthentication
        checks the same account and room before an explicit resume."
    cites:
      - kc-claude-plugins
    rules:
      - private-room-data
      - private-failure-visible
    note: >-
      Accepted design requires same-person/current-room review and explicit restoration against
      current cloud state. Durable local acknowledgement differs from cloud sync. No automatic
      write/merge, cross-origin migration or guaranteed hosted export. Draft implementation and
      runtime proof remain owed.

      Accepted slice r4-return-and-recover (Return to work and recover safely): private-return-context;
      private-access-recovery. Dependencies: r4-catalog, r5-pair-and-stop. Source
      private-return-context + private-access-recovery; lifetime fixes from private-host-parity;
      commits fd5aca4, 1f458f1, ad9b448, 65e96a0, 634e425, 7cf84f8, 3af3637, c213867, 8c0ae1f,
      bccb1c1, 7e5e040. Local durable browser transactions, account/room changes,
      quota/failure/reload, typed denial and no automatic flush; exact-version cleanup needs cloud
      acknowledgment. Port the accepted fourteen-day original-event bound and matching draft
      validator together; do not reinterpret inherited seven-day tests as current acceptance.
      Removal/deferral test: Pairing dependency is real in existing code: merge 3c664b9 has catalog
      and revocation parents. Whole existing return branch is not an r4-only change.
  - id: recover-private-access
    card: Understands unavailable access and chooses a safe next step
    activity: Recover my access
    stories:
      - id: understand-room-access-failure
        card: See why my room cannot open and recover safely
        release: r4-return-and-recover
        status: unverified
        questions:
          - id: q-r4-expiry-no-renewal
            ask: May Day2 access be renewed just to finish this release?
            answer: Do not extend legacy expiry to finish delivery. Verify each corresponding new connection in
              its original room before matching legacy revoke; already expired/revoked credentials
              remain denied.
          - id: q-r4-expiry-recovery-ui
            ask: After Day2 access expires, which recovery screen and explicit next action should Captain see?
            answer: Keep the requested room and original local work visible while paused. Distinguish ordinary
              expiry from denied authority; fresh verification and explicit same-person/room
              recovery are separate from choosing another room.
          - id: q-r6-denial-contract
            ask: How do browser and MCP clients distinguish expiry, revoked access, outage and known quota
              exhaustion?
            answer: >-
              Separate normal expiry, revoked/disabled authority, provider/network outage, known quota exhaustion and unknown mutation outcome. HTTP/MCP data routes use typed errors, never provider HTML or blind mutation retry.
              local review record: interrogation-v2-triage.md#theme-03 (not published)
          - id: q-logout-unconfirmed
            ask: What must explicit browser logout do with unconfirmed work in the original tab?
            answer: >-
              Allow cancel or explicit browser-session logout while retaining the original frozen local work and close/reload warning. Logout does not revoke independent installations or delete retained drafts.
              local review record: interrogation-v2-triage.md#theme-19 (not published)
      - id: revoke-delegated-agent-access
        card: Revoke one agent or disable its authorizing member
        release: r5-pair-and-stop
        status: unverified
        questions:
          - id: q-revoke-bound
            ask: What bounded behavior makes app revocation and provider-policy removal distinct?
            answer: >-
              Commit app denial/generation first; reject new operations and incoming writes immediately. Later stream leases target an observed stop within 60 seconds and report confirmation separately. Provider-only removal has no app-wide stop guarantee: app disable/revoke first, provider removal second.
              local review record: interrogation-v2-triage.md#theme-09 (not published)
          - id: q-audit-boundary
            ask: What minimal identity evidence is recorded without changing concurrency?
            answer: >-
              Record minimal operator-only lifecycle and mutation-batch admission/outcome receipts: actor/authorizer/credential IDs, room or unknown, category and server time. No tokens, digests, document payload or per-record event sourcing. Keep committed/receipt-pending distinct from unknown outcome; 30-day receipts exclude security tombstones.
              local review record: interrogation-v2-triage.md#theme-11 (not published)
          - id: q-operator-lifecycle
            ask: Which bounded operator surface manages verified bindings, legacy revoke and member disable?
            answer: >-
              Use the existing protected operator boundary for explicit exact verified bindings, room grants, legacy revoke and member disable. No first-visitor owner, email/label inference, invitation service or general admin platform.
              local review record: design-brief.md#accepted-legacy-connection-rollout-direction (not published)
          - id: q-auth-backup-safety
            ask: How can recovery restore documents without reviving stale human or delegated authority?
            answer: >-
              Document recovery must not restore old security authority. Preserve generations, revoked families/sessions and original expiries through backup/rollback; remove/regrant or disable/reenable never revives old authority.
              local review record: interrogation-v2-triage.md#theme-17 (not published)
    system:
      - "Current: server/host/policy.ts currentGrant/authorize rejects expired/revoked grants and
        forbidden rooms."
      - "Proposed: distinguish login expiry, explicit permission removal and transport outage; stop
        reads/writes/reconnect/wake admission on actual app revocation."
    cites:
      - kc-claude-plugins
    rules:
      - private-entry-identity
      - private-failure-visible
    note: >-
      Complete design confirmed 2026-10-19. Recovery retains original human work and identity/room
      context, requires explicit restoration, and preserves drafts through unknown outcomes.
      Stream-stop, durable storage/manual deletion, permission-regrant review and apply receipts
      remain later implementation/runtime work. No private agent transcripts or credentials are
      persisted as human drafts.

      Accepted slice r5-pair-and-stop (Pair and revoke one agent safely): private-agent-pairing;
      private-delegation-revoke. Dependencies: r4-entry. Source private-agent-pairing +
      private-delegation-revoke; commits ee016f1, b4f9458, 0976749, 6d35f5c, cd25067, c0c2a89,
      17f47d0. Local protected-store/atomic rotation and consent tests; real local Node/workerd
      sockets exercise refusal, missed fanout, lease stop, cold wake, original expiry and no
      revival. Separate denial receipt from observed stop. Hosted lease scheduling still requires
      host parity. Removal/deferral test: Native-model coediting is later; pairing and revocation
      stay together because removing stop protection repeats an observed disclosure.


      Accepted slice r4-return-and-recover (Return to work and recover safely): private-return-context;
      private-access-recovery. Dependencies: r4-catalog, r5-pair-and-stop. Source
      private-return-context + private-access-recovery; lifetime fixes from private-host-parity;
      commits fd5aca4, 1f458f1, ad9b448, 65e96a0, 634e425, 7cf84f8, 3af3637, c213867, 8c0ae1f,
      bccb1c1, 7e5e040. Local durable browser transactions, account/room changes,
      quota/failure/reload, typed denial and no automatic flush; exact-version cleanup needs cloud
      acknowledgment. Port the accepted fourteen-day original-event bound and matching draft
      validator together; do not reinterpret inherited seven-day tests as current acceptance.
      Removal/deferral test: Pairing dependency is real in existing code: merge 3c664b9 has catalog
      and revocation parents. Whole existing return branch is not an r4-only change.
