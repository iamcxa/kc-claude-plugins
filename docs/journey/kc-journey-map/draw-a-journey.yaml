      Accepted slice r7-host-parity (Accept the journey on both hosts): private-host-parity. Dependencies:
      r4-entry, r4-catalog, r5-pair-and-stop, r4-return-and-recover, r5-coedit, r7-members,
      r7-native-controls. Source private-host-parity; commits 43e0ed4, de5a25a, 9fd7fe5, 79944bd.
      First current-main local adapter matrix; then separately authorized cloud identity, member
      grants, logout/re-entry, native coedit, denial/lease/wake and quota/usage receipts; then a
      human operates the complete path. Receipt25 proves two identities only; run36 proves
      root/assets/config, not human acceptance. Removal/deferral test: Use a reviewed explicit setup
      procedure first; a consumer one-command installer is not needed to prove the hosted product
      contract. Hosted proof can reveal required product corrections in this slice.
