    rules:
      - handmade-cards-survive
  - id: native-private-controls
    card: Manages my account from the canvas
    activity: Control my access
    stories:
      - id: see-my-account-and-log-out
        card: See My account and log out safely
        release: r4-account
        status: unverified
        note: "Slice 2b: the native 「我的帳號」 account view and browser-session logout only. Build on merged
          entry and catalog; pairing, own-agent controls and current-room member readback stay in
          r7-native-controls. Cancel or explicit logout retains unconfirmed frozen work and a
          close/reload warning; logout neither revokes independent installations nor deletes drafts.
          Local interaction, delayed replies, focus and re-entry require new proof; no hosted
          acceptance is claimed."
      - id: manage-my-native-account
        card: Manage my agents and view current-room members
        release: r7-native-controls
        status: unverified
        note: "Remaining native-controls scope after slice 2b: own-agent controls and guarded
          current-room member readback. Account view and browser logout belong only to
          see-my-account-and-log-out; invitations and removal remain deferred."
      - id: invite-member-from-native-canvas
        card: Invite a member from the current room
        status: gap
        note: Accepted design only; recipient verifies identity before explicit owner final confirmation. No
          runtime admission in this proposal.
      - id: remove-member-from-current-room
        card: Remove a member from only the current room
        status: gap
        note: Accepted design only; unique owner, no self-removal or cross-room removal. Separate future
          task and membership decision.
    system:
      - "Candidate kc-journey-map/docs/native-account.md and server/host/human-store.ts: create-once
        owner:<backendId> metadata; guarded account/current-room reads. Native UI controls do not
        proxy operator credentials."
    rules:
      - private-entry-identity
      - private-agent-boundary
      - private-room-data
      - private-failure-visible
      - private-scope
    note: Historical candidate evidence covers owner/member/agent authority negatives and native
      desktop/mobile-width controls. Integrate the remaining own-agent and guarded current-room
      member controls after return/recovery and safe pairing, preserving account/logout from slice
      2b. Recheck delayed replies, focus and source acknowledgment on the new SHA; physical-device
      keyboard acceptance remains human work. Invitation/removal runtime remains deferred.
  - id: agent-collaboration
    card: Works with an authorized agent in the chosen room
    activity: Work with my agent
    stories:
      - id: pair-my-agent-installation
        card: Approve a named agent installation for selected rooms
        release: r5-pair-and-stop
        status: unverified
        questions:
          - id: q-pair-human-binding
            ask: How is a pairing code bound to its initiating client and verified authorizer?
            answer: >-
              Only a verified enabled human can approve an exact immutable requested room set within current grants. Bind the one-shot request to its initiating verifier; a code or self-reported agent label is not authority.
              local review record: interrogation-v2-triage.md#theme-18 (not published)
          - id: q-pair-supported-client
            ask: Do current Claude and Codex clients support the proposed pairing flow?
            answer: Use the bounded installation helper for stable native stdio and protected endpoint
              forwarding. Actual Claude/Codex configuration and secure OS credential storage remain
              runtime obligations; no universal OAuth/client support is claimed.
          - id: q-pair-lifetime-policy
            ask: When do proposed lifetimes begin, and which interruptions require fresh human consent?
            answer: >-
              Approved defaults: pairing 5 minutes, local handoff 60 seconds, access 15 minutes, human sign-in at most 7 non-sliding days. Persistent installation consent lasts until revoke; short-access expiry normally renews automatically. Human age does not force agent re-pairing.
              local review record: design-brief.md#accepted-persistent-installation-renewal-direction (not published)
          - id: q-pair-atomic-retry
            ask: How are atomic redemption, lost replies and agent-to-human-session escalation prevented?
            answer: >-
              Consume one initiating verifier once in a metadata transaction that creates one family and returns secrets once. Lost pairing reply permits only revoke/cancel reconciliation before a fresh request; agent/legacy credentials cannot mint humans or approve pairing.
              local review record: interrogation-v2-triage.md#theme-15 (not published)
          - id: q-agent-renewal-family
            ask: What permits automatic renewal, and how do family revoke, lost membership and compromised
              secrets affect an installation?
            answer: >-
              Effective delegation is the intersection of current authorizer room grants and approved installation scope. Rotating refresh preserves persistent consent without inactivity expiry. Revoked family, member disable and room-generation loss deny renewal/access; secure helper storage and revocation proof are required.
              local review record: design-brief.md#accepted-persistent-installation-renewal-direction (not published)
          - id: q-agent-refresh-races
            ask: How will refresh rotation detect replay and handle concurrent requests or a lost response
              without minting duplicates or reviving authority?
            answer: >-
              Single-flight helper refresh plus atomic spent-digest rotation prevents duplicate branches. Authenticated replay revokes; random guesses cannot revoke. Unknown refresh/lost reply or failed secure save pauses that installation, confirms revoke-only reconciliation, then requires fresh human pairing. Ordinary network loss alone is not repair.
              local review record: design-brief.md#accepted-persistent-installation-renewal-direction (not published)
      - id: collaborate-in-my-permitted-room
        card: Work with my authorized agent in the same room
        release: r5-coedit
        status: unverified
        questions:
          - id: q-r4-independent-agent-rights
            ask: Does adding Day2 to the human menu also give Codex or Claude access?
            answer: A human menu entry gives no agent rights. Each installation needs its own explicit pairing
              and delegated rooms; independent legacy grants retain only original scopes/expiry.
          - id: q-r4-browser-agent-store
            ask: Which path proves the browser and native agents use the same existing canvas?
            answer: >-
              Verify browser and each native agent against the same backend, original room/record IDs and authorized read/write path using synthetic sentinels. Local simulation, connector configuration or a login page alone is not full native/hosted proof.
              local review record: interrogation-v2-triage.md#theme-13 (not published)
          - id: q-agent-data-authority
            ask: Should delegated room read/write include whole-document replacement and enabled Node
              capabilities, or be explicitly narrowed?
            answer: >-
              Retain existing room read/write powers, including delete and whole-document replacement, with explicit exact-scope consent disclosure. Node save/checkout apply only when configured and granted. Do not silently add read-only/per-action narrowing or a concurrency redesign.
              local review record: design-brief.md#accepted-delegated-capability-scope (not published)
          - id: q-agent-attribution
            ask: How can a human identify stateless agent activity without claiming fabricated live presence?
            answer: >-
              Show server-derived recent activity and installation identity separately from self-reported labels. Stateless tool calls are not fabricated online/model presence; no cryptographic per-record model attribution is added.
              local review record: interrogation-v2-triage.md#theme-14 (not published)
    system:
      - "Current main: server/host/policy.ts authenticate supports verified human sessions and
        legacy grants; transport.ts exposes /mcp. Per-installation pairing, rotation and delegated
