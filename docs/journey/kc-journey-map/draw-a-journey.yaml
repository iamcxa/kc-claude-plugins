releases:
  - id: r1
    name: RELEASE 1
    goal: A person can draw a story map by talking, and plan with it.
  - id: r2
    name: RELEASE 2
    goal: The same map can be checked against the code that exists.
  - id: r3
    name: RELEASE 3
    goal: Author a function model, iterate on it quickly, and hand one agreed Development Brief to
      development planning.
  - id: r4
    name: RELEASE 4 · ACCEPTED DESIGN
    goal: A verified human enters and returns to the intended permitted canvas through one native entry.
  - id: r5
    name: RELEASE 5 · ACCEPTED DESIGN
    goal: A verified human pairs one agent installation and coedits the same permitted room with a
      distinct actor.
  - id: r6
    name: RELEASE 6 · ACCEPTED DESIGN
    goal: A human safely recovers expired sessions and independently revokes agents or members without
      losing same-tab work.
  - id: r7
    name: RELEASE 7 · ACCEPTED DESIGN
    goal: The complete private journey has equivalent Node and Cloudflare admission with local Free-plan
      usage proof.
ownership:
  - id: own-author
    owner: The engineer
    from: write
    to: write
    note: owns the claims, the citations and the model
  - id: own-tool
    owner: The skill
    from: render
    to: readback
    note: owns the drawing, the contract, the lint and the read-back
rules:
  - id: file-is-truth
    text: The file in the repository is the source of truth; every board or document is generated from it
  - id: board-is-a-cache
    text: Read or export canvas edits before rerendering; the room is a projection of the journey file
  - id: handmade-cards-survive
    text: A shape with no meta.journey is never touched by a re-render, and is reported as unclaimed
  - id: no-cell-from-memory
    text: Every System Flow cell cites something read this session; a recalled fact is a hypothesis
  - id: contract-is-generated
    text: The per-release contract is generated from the journey file on every run; there is no
      hand-edit path
  - id: grep-is-the-check
    text: A lint that can be made to fire on a real defect is a check; one that cannot is decoration
  - id: share-is-not-read-only
    text: The shared front-end syncs over the same /connect/ channel the canvas uses; a link holder
      edits the board
  - id: link-dies-with-the-process
    text: A quick tunnel's hostname cannot be chosen and is not reused; every restart invalidates a link
      already sent
  - id: lossy-inverse
    text: Lane 2 and lane 3 have no honest inverse — canvas text cannot be mapped back to a rule id
  - id: ambiguity-refused
    text: tldraw copies meta verbatim on duplicate, so a duplicated nodeId refuses the whole reorder
  - id: model-is-written-not-derived
    text: A function map is written by a person reading the code, not transformed out of prose by the
      tool
  - id: same-columns-new-lanes
    text: The function map keeps the journey's columns and swaps the lanes; it is not a second tool
  - id: events-carry-order
    text: Event order is authored modeling input; the projection does not infer causality or build order
  - id: selection-is-per-call
    text: Which projections a render draws is chosen per call, never stored in the journey file — the
      same file renders one way for a stand-up and another for a release review
  - id: r3-feedback-measurement
    text: "R3 direction: keep an existing compatible server running; never stop a non-owned server for
      cleanup. Full request-to-visible-link timing and compatibility detection remain unverified;
      baseline and target are unset. The POC does not justify renderer optimization."
  - id: r3-model-authoring
    text: Author the model in the source; a standalone handler is not required. Edit then redraw; direct
      function-map canvas writeback stays deferred. Event order alone does not establish causality
      or a build schedule.
  - id: r3-handoff-authority
    text: Dev-flow owns technical shaping once, under existing profile/admission authority. No automatic
      task creation or scheduling; task counts do not prove a story exists or a journey is accepted.
  - id: private-entry-identity
    text: Verify provider identity before app-member binding. Browser cookie, agent credential and
      deployment token are distinct. Never log credentials.
  - id: private-room-data
    text: Keep A, B and qnow-day2 ids and all data. Old links and switching never copy, clear or replace
      documents.
  - id: private-room-selection
    text: "Accepted entry rule: explicit URL room first; otherwise resume the last-worked
      still-permitted room. First use or ineligible remembered room shows available-room selection.
      An explicit unauthorized URL shows recovery without automatic room substitution. Recheck
      current permission; no A default."
  - id: private-failure-visible
    text: Show requested room and safe recovery after failure. No false connected/saved claim. Recheck
      access on return.
  - id: private-agent-boundary
    text: Agent rooms intersect current authorizer grants and delegated grants; expiry/revoke/disable
      deny reads and writes. Denied operations change nothing.
  - id: private-scope
    text: Accepted 2026-10-19 design; Pilot implementation in four slices. Preserve room
      engine/data/concurrency. Cloudflare Free; detailed usage receipts remain local. Formal merge
      needs separate Captain confirmation.
status:
  unproven: "2026-10-19: complete technical design confirmed for Pilot implementation in four slices,
    eight stories (3/2/2/1), and 31 design question dispositions. Historical QA references to
    pending overall design approval are superseded by this confirmation and private-entry.md. This
    first-story source candidate has local synthetic security/browser evidence only; independent
    validation and actual provider, stream stop, installation storage, draft durability and Free
    workload proofs remain separate. No whole-journey runtime acceptance or activation is claimed."
  unmerged: This planning source records scoped observations and accepted direction; it does not
    report current repository-wide PR or merge state.
  undeployed: The new verified-human entry is opt-in and the deployed default is unchanged. No
    provider configuration, live credential changes, original-room writes or deployment have been
    performed.
  irreversible: Deleting a room loses unexported native edits. Read back edits or export a .tldr
    backup first; generated contracts can be rebuilt.
  as_of: 2026-10-19
