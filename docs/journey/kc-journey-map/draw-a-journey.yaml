      - private-scope
    note: >-
      Accepted design requires shared admission/error behavior with explicit host capability
      differences, Cloudflare Free and local-only usage detail. Local adapter tests are not real
      provider/Free workload acceptance. No deployment, provider/account changes, Sites removal or
