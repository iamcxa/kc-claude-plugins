ownership:
  - id: O1
    owner: 使用者／該層級獲授權決策者
    from: A1
    to: A4
    note: 裁決權依適用層級人類授權；OS／process context、gh帳號或Sites owner不自動賦予它。
  - id: O2
    owner: 各runtime／checkout持有者；選配host另由原維護者負責
    from: A5
    to: A5
    note: agent透過既有Git操作code／data checkout，CLI只重讀與回報loaded view；S17遠端host維護延後。
  - id: O3
    owner: 接手 agent 與既有 dev2／Spacedock 流程
    from: A6
    to: A7
    note: 每位接手者須有已授權CLI執行／來源存取路徑；CLI提供依據，既有dev2／Spacedock保有任務與驗收權威。
  - id: O4
    owner: 使用者／原適用層級決策者
    from: A8
    to: A8
    note: 負責 A8 重審；新證據回到 A3 討論與確認，不能由工具自動批准。
releases:
  - id: P1
    name: P1（已選／Pilot）— 帶著精確裁示走完一次交接
    goal: 使用者指定一個獨立決策repo與完整commit後，Claude以CLI讀出一筆裁示的精確引用與原狀態並交給Codex；Codex在自己的已授權環境以同一CLI重讀核對，經既有dev2／Spacedock完成一個合成任務，使用者取回對應該引用的原始執行與驗收證據。
    slice_because: S21、S22沿用既有dev2／Spacedock與Git／gh；新工作在S01、S10、S11、S19、S20。拆開任一段，交接迴圈就不能端到端走完。
  - id: P2
    name: P2（候選）— 查明各方版本差異
    goal: 接手者分清各runtime的CLI code／ADR checkout與loaded view，知道已配置checkout相對ref的五態、時間及dirty阻礙；選配遠端host只在實際採用時另列。
  - id: P3
    name: P3（候選）— 安全對齊並重新讀取
    goal: 各runtime持有者依既有Git權限安全更新已配置checkout或保留原狀並說明，再用CLI重讀實際ADR commit與loaded view；不以本片維護遠端host。
  - id: P4a
    name: P4a（候選）— 第三端加入並看出差距
    goal: dot經已授權且可執行CLI的路徑讀取同一裁示並參與交接；接手者以原任務證據整理裁示與結果之間的預期、實際、未知與影響。
  - id: P4b
    name: P4b（候選）— 處理跨層衝突並重新裁示
    goal: 工程方案引用的上層版本改變或出現衝突時，工程 agent 能呈現影響、交回適用決策者，並把確認後的新版本重新交接。
  - id: P5
    name: P5（候選）— 把確認草案送成受控 PR
    goal: 在已配置來源內，使用者確認精確內容、範圍與 base 後，獲准提交者建立一個可審查 PR，回讀 PR 身分與提交內容，證明沒有重複或越權。此片的完成不等待 merge、ADR Accepted 或 host 載入。
status:
  as_of: 2026-10-20
  unproven: 規劃意圖；CLI、交接驗收與 fit 未驗。P1 已重切並選定，其餘候選。
  unmerged: "本次 CLI-first 地圖更新於 PR #681 送審；未代表主分支已有產品實作。"
  undeployed: 新 CLI 未部署；舊 Sites／MCP 的觀測不作本版本驗收。
  irreversible: 本圖不授予外部動作；Git、PR、合併與部署各依原流程及適用授權。
