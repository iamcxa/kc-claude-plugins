# kc-journey-map planning intent; no implementation status is asserted.
journey: kc-decision-log-design
title: 使用者與 agents 共用決策的故事地圖
persona: 使用者：對跨專案方向負責的總指揮；由 Claude、Codex、dot 協助讀取、交接與回報。
one_journey: 使用者確認的裁示有獨立Git原文與明確權限；agents在各自已授權的執行環境用同一CLI核心讀對版本、對齊自己持有的checkout，交由既有流程執行，再帶證據回來重新決策。
now:
  - id: n1
    card: 在對話與 Git 之間核對裁示
    pain: 對話中的共識、ADR 狀態與行動許可可能混淆。
    workaround: 由使用者或 agent 人工確認原文、版本及本次授權。
  - id: n2
    card: 在不同執行環境核對同一原文
    pain: 工具code、ADR revision與各runtime loaded view可能混淆。
    workaround: 使用既有Git能力人工核對明確來源／commit與操作身分，不把另一端的登入或摘要當本端驗收。
rules:
  - id: R1
    text: 各使用者指定獨立決策庫；共用程式不保存私人原文或憑證。
  - id: R2
    text: 總指揮與工程決策的裁決者、來源及適用範圍分開。
  - id: R3
    text: 工程 ADR 留在原 repo；引用上層版本，不能反向覆蓋。
  - id: R4
    text: 裁示、身分與行動許可各自核對；任務與驗收沿用原流程。
  - id: R5
    text: 判定保留原文與版本；含糊、衝突、無權或版本不明均不補猜。
  - id: R6
    text: 程式版本、各庫 commit 與各端載入版本分開標示。
  - id: R7
    text: CLI 唯讀；持有者僅在已配置、乾淨且可快轉時更新並重讀。
  - id: R8
    text: 機敏資料留在原來源；公開案例用合成資料，動作依各次授權。
  - id: R9
    text: ADR 沿用 dev2 格式與配號；實質變更新檔，小修保留原話及歷史。
steps:
  - id: A1
    activity: 設定自己的決策空間
    rules:
      - R1
      - R6
    stories:
      - id: S01
        card: 我指定獨立決策庫與追蹤分支
        questions:
          - id: cli-p1-u03
            ask: 如何沿用原生路徑而不依賴DOT？
            answer: Gap：依配置root讀原生路徑，不搬檔；loader仍待驗。
            doc: https://github.com/iamcxa/kc-claude-plugins/blob/docs/kc-decision-log-cli-map/docs/journey/kc-decision-log/p1-technical-contract.md#cli-p1-u03
          - id: cli-p1-u08
            ask: 離線固定commit如何讀取？
            answer: Fact：只讀既有固定commit、不fetch；安全仍待驗。
            doc: https://github.com/iamcxa/kc-claude-plugins/blob/docs/kc-decision-log-cli-map/docs/journey/kc-decision-log/p1-technical-contract.md#cli-p1-u08
          - id: cli-p1-u10
            ask: binding配置與fingerprint如何定義？
            answer: Gap：顯式可信配置，摘要排除本機位置；仍待驗。
            doc: https://github.com/iamcxa/kc-claude-plugins/blob/docs/kc-decision-log-cli-map/docs/journey/kc-decision-log/p1-technical-contract.md#cli-p1-u10
