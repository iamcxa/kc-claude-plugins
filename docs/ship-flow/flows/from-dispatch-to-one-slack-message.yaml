name: from-dispatch-to-one-slack-message
description: |
  CLI e2e journey for the Milestone "From dispatch to one Slack message":
  over a fixture batch record, run the stations that exist at this item's
  base, each with its declared expected exit. Later layers append their
  stations' steps to this same file rather than starting a new one.
steps:
  - id: accept-recorded-evidence
    action: "Execute external"
    description: "accept-evidence.sh accepts an already-verified, real recorded Evidence block"
    execute:
      cli:
        - run: "bash kc-ship-flow/scripts/accept-evidence.sh kc-ship-flow/scripts/fixtures/e2e-gate/recorded-evidence-block.txt"
          expect: "exit code 0"

  - id: e2e-gate-not-applicable
    action: "Execute external"
    description: "the e2e gate records 'e2e: not applicable' for a milestone with no flow file"
    execute:
      cli:
        - run: "python3 kc-ship-flow/scripts/e2e-gate.py kc-ship-flow/scripts/fixtures/e2e-gate/plan-receipt.ac3.json kc-ship-flow/scripts/fixtures/e2e-gate/close-receipt.ac3.json"
          expect: "exit code 0"

  - id: uat-doc-builds-batch-document
    action: "Execute external"
    description: "uat-doc.py builds the batch UAT document from durable records only"
    execute:
      cli:
        - run: "python3 kc-ship-flow/scripts/uat-doc.py kc-ship-flow/scripts/fixtures/uat-doc/batch-e56e9f09873c"
          expect: "exit code 0"

  - id: close-receipt-refuses-undispositioned-defect
    action: "Execute external"
    description: "validate-receipt.py refuses the recorded close-receipt.DRAFT.json naming S24, S25, S26 with no fix_ticket or accepted_residual"
    execute:
      cli:
        - run: "python3 docs/plan-flow/schema/validate-receipt.py kc-ship-flow/scripts/fixtures/close-receipt/plan-receipt.json kc-ship-flow/scripts/fixtures/close-receipt/plan-approval.json kc-ship-flow/scripts/fixtures/close-receipt/close-receipt.DRAFT.json"
          expect: "exit code 1"

  - id: close-receipt-accepts-dispositioned-with-debriefs
    action: "Execute external"
    description: "validate-receipt.py accepts the same receipt once S24, S25, S26 carry accepted_residual and both debriefs carry their minimum fields"
    execute:
      cli:
        - run: "python3 docs/plan-flow/schema/validate-receipt.py kc-ship-flow/scripts/fixtures/close-receipt/plan-receipt.json kc-ship-flow/scripts/fixtures/close-receipt/plan-approval.json kc-ship-flow/scripts/fixtures/close-receipt/close-receipt.dispositioned.json"
          expect: "exit code 0"
