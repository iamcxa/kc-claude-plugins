<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Journey board</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; padding: 28px 24px 20px; background: #fff;
         font: 14px/1.35 -apple-system, "Helvetica Neue", "PingFang TC", sans-serif; color: #17161a; }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .sub { font-size: 12px; color: #6b6873; margin: 0 0 18px; }
  table { border-collapse: separate; border-spacing: 10px; table-layout: fixed; width: 100%; }
  th { width: 132px; }
  .lane { border-radius: 8px; padding: 12px 10px; font-weight: 600; font-size: 14px;
          text-align: left; vertical-align: top; }
  .lane small { display: block; font-weight: 400; font-size: 11px; color: #59565f; margin-top: 6px; }
  .l1 { background: #F8DA94; } .l2 { background: #C7B6F7; } .l3 { background: #F1AAA1; }
  td.cell { vertical-align: top; }
  .note { border-radius: 6px; padding: 11px 11px 12px; min-height: 92px;
          box-shadow: 0 1px 2px rgba(0,0,0,.12); font-size: 12.5px; }
  .n1 { background: #F8DA94; } .n2 { background: #C7B6F7; font-size: 12px; } .n3 { background: #F1AAA1; font-size: 12px; }
  code { font: 11.5px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; background: rgba(255,255,255,.55);
         padding: 0 3px; border-radius: 3px; }
  .step { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; color: #7a6a3d; display: block; margin-bottom: 5px; }
  .badge { border-radius: 3px; padding: 1px 5px; font-size: 9.5px; letter-spacing: .05em;
           margin-left: 6px; vertical-align: 2px; background: #17161a; color: #fff; }
  .badge.warn { background: #b3261e; }
  .cite { display: block; margin-top: 7px; font: 10.5px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
          color: #453f5c; opacity: .85; }
  .status { margin-top: 14px; background: #17161a; color: #fff; border-radius: 8px;
            padding: 12px 14px; font-size: 12.5px; }
  .status b { color: #F8DA94; }
</style>
</head>
<body>
<h1 id="title"></h1>
<p class="sub" id="subtitle"></p>
<table id="board"></table>
<div class="status" id="status"></div>

<script type="application/json" id="data">
{
  "title": "<system> — user journey board",
  "subtitle": "Columns are journey steps. Each lane cell sits under the step it serves. Measured against <what was read>.",
  "lanes": {
    "journey":    { "label": "User Journey", "hint": "what a person does" },
    "flow":       { "label": "System Flow",  "hint": "what the system does" },
    "constraint": { "label": "Constraints",  "hint": "what must stay true" }
  },
  "columns": [
    {
      "step": "1 · STEP NAME",
      "badge": null,
      "journey": "One sentence, <=12 words, in the user's language.",
      "flow": "The call, route, or write under this exact step.",
      "cite": "path/to/file.ts:120",
      "constraint": "The invariant that must hold at this step."
    }
  ],
  "status": "STATUS — what is unproven, unmerged, or undeployed. This field is mandatory and must not be empty."
}
</script>

<script>
  const d = JSON.parse(document.getElementById("data").textContent);
  document.title = d.title;
  document.getElementById("title").textContent = d.title;
  document.getElementById("subtitle").textContent = d.subtitle;

  const row = (key, cls, noteCls, withStep) => {
    const lane = d.lanes[key];
    const cells = d.columns.map(c => {
      const step = withStep
        ? `<span class="step">${c.step}${c.badge ? `<span class="badge${/NOT BUILT|NOT RULED/.test(c.badge) ? " warn" : ""}">${c.badge}</span>` : ""}</span>`
        : "";
      const cite = key === "flow" && c.cite ? `<span class="cite">${c.cite}</span>` : "";
      return `<td class="cell"><div class="note ${noteCls}">${step}${c[key] ?? ""}${cite}</div></td>`;
    }).join("");
    return `<tr><th><div class="lane ${cls}">${lane.label}<small>${lane.hint}</small></div></th>${cells}</tr>`;
  };

  document.getElementById("board").innerHTML =
    row("journey", "l1", "n1", true) + row("flow", "l2", "n2", false) + row("constraint", "l3", "n3", false);
  // The status card is mandatory. An omitted one must be loud, not blank — a board with an
  // empty black bar reads exactly like a board that had nothing to disclose.
  const status = document.getElementById("status");
  if (!d.status || !d.status.trim()) {
    status.style.background = "#b3261e";
    status.innerHTML = "<b>STATUS CARD MISSING —</b> this board makes no claim about what is "
      + "unproven, unmerged, or undeployed. Do not present it until it does.";
  } else {
    status.innerHTML = d.status.replace(/^([A-Z][A-Z ]+—)/, "<b>$1</b>");
  }
</script>
</body>
</html>
