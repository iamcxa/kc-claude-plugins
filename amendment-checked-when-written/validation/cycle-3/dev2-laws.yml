name: dev2-laws

on:
  push:
    branches: ["spacedock-state/dev2"]

permissions:
  contents: read

jobs:
  laws:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout state branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
          path: state

      - name: Checkout the package scripts
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: iamcxa/kc-claude-plugins
          ref: "22219a3e4bc48a69a893bd757923e8c034d1ba6e"
          sparse-checkout: kc-dev-flow-2
          persist-credentials: false
          path: package

      - name: Checkout the trunk workflow README
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: "main"
          sparse-checkout: "docs/dev2/README.md"
          sparse-checkout-cone-mode: false
          persist-credentials: false
          path: trunk

      - name: laws_check.py
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          python3 package/kc-dev-flow-2/scripts/laws_check.py state \
            --before "$BEFORE" \
            --after "$AFTER" \
            --readme "trunk/docs/dev2/README.md"
