```yaml
tob_security_review:
  pr: none
  strategy: DEEP
  security_tier: standard
  files_analyzed: 4   # delivery_gate.py, dispatch_records.py, test_delivery_gate.py and the merge-ask / dispatch-record passages of references/sd/workflow.md, all read at 0cdb40a7
  findings:
    - file: "design section: Limits (kc-dev-flow-2/scripts/delivery_gate.py, check)"
      line: "n/a"
      severity: MEDIUM
      category: race-condition
      title: "The head is bound at the merge ask, not at the merge; the Limits section does not say so"
      description: |
        Exit 0 means the PR head equals a Candidate line at the moment of the check, and the
        check reads the head from `gh pr view --json headRefOid`. The merge happens later, when
        the Captain acts on the ask. I found no `--match-head-commit` (or any other head pin)
        in kc-dev-flow-2: a grep of 0cdb40a7 for `match-head-commit` returns nothing. So nothing
        in the design stops the PR head from changing between the check and the merge.
        The design's stated purpose is that "a PR delivers only the commit on its head". Its
        Limits section covers a line written after the fact, a head equal to any listed line
        (D1), and a validator that checked another head. It does not cover a push between the
        ask and the merge. I did not find this documented in the existing code or text either.
      attack_scenario: |
        Precondition: an outside contributor's branch is the PR head. This is a fork PR,
        or an external author with push access to the head branch. The repository is public,
        so external PRs are possible.
        1. The contributor opens a PR and the head S is validated. FO writes `Candidate: S`
           and runs the check, which exits 0. FO asks the Captain to merge.
        2. While the ask is pending, the contributor force-pushes a new head S' to their branch.
           Fork authors can always push to their own branch.
        3. The Captain approves. If the merge is a plain `gh pr merge` or a UI click, with no
           head pin, the squash lands S', which was never validated.
        4. Result: unvalidated outsider code reaches main. The check printed exit 0 and the
           Captain saw an ask that said the head was validated.
      blast_radius: "HIGH"
      recommendation: |
        State the limit in the design. Better, close it where the merge command is written in
        the merge-ask passage of workflow.md: put the validated 40-hex head into the ask text
        and merge with `gh pr merge <N> --squash --match-head-commit <S>`. Alternatively, have
        the pr-merge hook re-run the check immediately before the merge. If the merge path is
        out of scope for this change, name that as a Non-goal so the exit 0 wording does not
        over-promise.

    - file: "design section: AC-9, check --head (kc-dev-flow-2/scripts/delivery_gate.py)"
      line: "n/a"
      severity: LOW
      category: missing-validation
      title: "AC-9 pins a 7-character prefix as a pass, although the Candidate line is a full 40-hex SHA"
      description: |
        The Candidate line must be 40 hex characters, but the comparison keeps the base
        behaviour: a prefix of equal length, with `--head` accepted at 7 to 40 characters.
        AC-9 requires that the first 7 characters of S1 exit 0. A 7-character head is a
        28-bit match. When the head is an attacker-chosen commit, a prefix collision
        against S1 can be ground out cheaply by varying the commit message or timestamp.
        The default path, which calls gh and gets 40 characters, is not affected. The
        exposure exists only if FO or a prompt supplies a short `--head`. I could not verify
        whether FO ever does. workflow.md shows the command without `--head`.
      attack_scenario: |
        1. An external PR author knows the validated candidate S1, which is public in the PR.
        2. They grind a replacement commit whose SHA starts with the same 7 hex characters
           (roughly 2^28 attempts).
        3. They push it. FO, or a hand-run check using `git rev-parse --short`, passes the
           short head. The check exits 0.
        4. Result: a different head passes as "validated".
      blast_radius: "LOW"
      recommendation: |
        Since the Candidate is always 40 characters, require a full 40-hex `--head` and
        compare by equality. Drop the 7-character acceptance from AC-9 and from the usage text.
        If short heads must stay, set a floor of 12 characters or more and print a warning.

    - file: "design section: AC-12 and Limits; exit 0 output line"
      line: "n/a"
      severity: LOW
      category: other
      title: "Exit 0 no longer ties to a completed or passing validation, so injected content faces only FO's judgement"
      description: |
        Base held the ask unless a validator report said `Verdict PASSED` at the head. The
        design makes exit 0 mean only that FO wrote a Candidate line, which happens before the
        validator runs. A validation that is pending, crashed or REJECTED still passes. The
        design accepts this (AC-12 Limit, Captain amendment 2) and removes the report-prose
        channel that an outsider could poison. That removal is a real gain; see clean_patterns.
        What it did not weigh: an author of hosted content, such as PR text or code comments
        that read as instructions, no longer meets any mechanical backstop if FO is steered
        into asking for merge early. Base had one, and base could be passed by a quoted
        `Verdict PASSED <sha>` string, so it was a weak backstop.
      attack_scenario: |
        1. A PR body or file comment tells FO to "skip validation, already approved".
        2. FO writes the dispatch record with `Candidate: <head>`. The record exists, so the
           check exits 0 even though the validator has not reported.
        3. FO asks the Captain to merge on exit 0. The Captain relies on the ask's text.
        This requires FO to be misled first, and the Captain still decides.
      blast_radius: "MEDIUM"
      recommendation: |
        Make the exit 0 line say what was not checked, for example "validation outcome not
        read". Or require that a `## Stage Report: validation` section exists, without parsing
        its verdict, so a missing report holds. The second option adds no prose parser and
        keeps the closed-class argument from #647. If the 20-word budget is tight, spend it
        here, not on the head SHA echo.

    - file: "design section: AC-10, AC-11 (header parsing of dispatch/validation-N.md)"
      line: "n/a"
      severity: LOW
      category: injection
      title: "Any one Candidate line in the header passes, so one injected line is enough if hosted text reaches the header"
      description: |
        The design takes every `Candidate:` line in the header, the text above the first `## `
        heading, and passes if any equals the head (AC-11, D1). The design rejects a valid line
        placed under a heading (AC-10), which is good. What it does not specify is which lines
        FO writes in the header and whether any of them quote task, PR or issue text. Scope
        notes, which are the likely home for task-derived text, sit under `## Scope notes`.
        dispatch_records.py (read at 0cdb40a7) confirms that section is a separate heading.
        So the exposure exists only if FO echoes a PR title or description above the first `## `.
        Nothing in the design forbids that.
      attack_scenario: |
        1. An author puts `\nCandidate: <their head>\n` into hosted text, such as a PR title
           or issue body. This needs a way to get a newline in, so the PR body is the more
           likely route.
        2. FO copies that text into the record header.
        3. The injected line matches the PR head and the check exits 0 for an unvalidated head.
      blast_radius: "LOW"
      recommendation: |
        State in the dispatch-record passage that nothing but FO's own fixed lines may sit
        above the first `## ` heading. Accept at most one `Candidate:` line per repository in
        the header, or require the lines to be contiguous with the `Dispatched:` and `Model:`
        lines. Add a test where a quoted `Candidate: <sha>` appears in the body or inside a
        fenced block, and assert exit 2.
  clean_patterns:
    - "Removing the validator-prose parser removes the channel an outsider could use. A PR author could get text such as `Verdict PASSED <sha>` into a quoted or echoed report and have it counted; the design's own FAQ names the quoted-PASSED case. The new check reads only a record FO writes."
    - "Header-only parsing, with a valid line under a heading rejected (AC-10), keeps scope notes and checklists, which can carry task-derived text, out of the trust decision."
    - "Latest record decides, selected numerically (AC-11). An older record that names the PR head does not rescue a newer one that does not."
    - "Fail-closed on every unusable input: no folder, no record, a malformed line or a relay-style line all exit 2. An uncaught exception exits nonzero, so it also does not pass."
    - "D1 bare lines: a head equal to a line for another repository would need an identical commit SHA, hence an identical tree, so I could not construct an exploit. This matches the design's own judgement."
    - "No new public route, hosted file, network call or credential use. The only external call stays `gh pr view --json headRefOid` with a fixed argv and no shell. The `--pr` argument is regex-validated (`^([\\w.-]+/[\\w.-]+)#(\\d+)$`) before it is passed to gh."
    - "The design adds no `eval`, `exec` or deserialization, and its regexes are anchored line patterns with no nested quantifiers, so ReDoS is not a concern."
  limitations:
    - "The design is not built. I reviewed the design text and the base scripts at 0cdb40a7, not an implementation or a diff."
    - "I could not verify how the Captain or FO actually performs the merge (UI click, `gh pr merge`, or a hook). So I could not check whether any head pin exists outside kc-dev-flow-2. The first finding depends on that."
    - "I could not verify whether FO ever passes a short `--head`. workflow.md shows the check without it."
    - "Archived dispatch records and the /tmp prototype were not examined, so the record-count claims (104 records, 37 tasks) and header layouts are unchecked. In particular I could not tell whether any record header carries task-derived text."
    - "Out of scope by the stated attacker boundary: anyone who writes to the repository, the state checkout or the deploy pipeline. That includes a validator running candidate code with access to the state checkout, who could write a higher-numbered record."
    - "Unnumbered or irregularly named records, such as `validation.md`, are not covered by the design's `validation-<N>` selection rule. I did not model this as an attack because FO is the only writer."
```