name: quoted-run-fixture
description: |
  Regression fixture for kc-ship-flow/scripts/parse-execute-external.py: a
  single-quoted `run` value must be found by the PyYAML-based parser, not
  silently skipped the way a regex scoped to `run: "..."` would skip it.

steps:
  - id: quoted_false
    action: "Execute external"
    description: "A single-quoted run value that always fails"
    execute:
      cli:
        - run: 'false'
          expect: "exit code 0"
