    - "That authenticateDevice accepts a self-minted dev_/sec_ pair on first use is inferred from scripts/smoke-deployment (which mints random ones) and the 'self-minted device' wording in docs/architecture.md section 6. auth.ts/admission.ts were not read line by line."
    - "Owner-side handling of Result bodies (the owner's agent or UI) is outside this tree, so the impact of the LOW finding is not verified."
    - "Static review only, as instructed: no project scripts, tests, or deployment requests were run. Cost per GB of the storage amplification was not measured."
