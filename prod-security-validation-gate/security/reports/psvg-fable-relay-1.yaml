    - "Routing unchanged: no new function/edge path; `public/_redirects` is generated by scripts/generate-web-proxy.ts and carries only `/web/*`; `/` had no handler before, so `public/index.html` shadows nothing; `/llms.txt` does not collide with `/r/:b`, `/api/*`, `/auth/*` or `/web/*`."
    - "public/index.html has no script, no external resource, no form; nothing for a CSP to gate."
    - "scripts/smoke-deployment: untrusted response bodies go only through a glob `case`, `sed -n 's/^OpenAPI version: //p'`, `jq -r` and `-w '%{http_code}'`; no eval, no unquoted expansion; `/openapi.json` is written under a `mktemp -d` dir removed on EXIT."
    - "scripts/front-door.test.ts asserts /llms.txt contains no `/api/`, `dev_`, `sec_` or `X-Subspace-Device`, so owner-side credentials and routes cannot be published through the agent front door without a test failure."
    - "scripts/generate-openapi.test.ts `CONTRACT_FINGERPRINTS` pins the generated document to `info.version` (sha256 over the document with version blanked); a silent contract change fails the suite. Governance control, correctly append-only by instruction."
    - "Server side matches what /llms.txt publishes: `validateSession` requires `Origin` and `X-Relay-Room-Csrf` on protected calls; `enter` needs neither (netlify/lib/session.ts) and redirects on a mismatched Origin (netlify/lib/share.ts); the submitted `actor` must equal `agent:${session.agent.name}` (`expectedActor`, room-feedback.ts), so a declared name cannot impersonate another session or an owner."
