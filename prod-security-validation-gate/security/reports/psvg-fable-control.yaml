    - file: "kc-dev-flow-2/scripts/number_guards.py"
      line: 157
      severity: LOW
      category: "missing-validation"
      title: "R6 is silently not evaluated when the task frontmatter does not parse, and check output cannot show whether it ran"
      description: |
        `task_facts` sets `poc` only when `frontmatter(task).get("profile") == "poc"`. `frontmatter()` returns `{}` unless the very first line is exactly `---` (a UTF-8 BOM or a leading blank line defeats it; CRLF is fine because `read_text()` translates newlines), and the value must be the bare or quoted string `poc` (any trailing comment or different case fails the equality). In every one of those cases `check` prints `PASS: no findings` and exits 0 for a head that changed files under `migrations-path:`. The two existing skip paths each print a line (`R4 skipped: no --task given`, `migration guard skipped: no migrations-path declared`); R6 prints nothing when it is not evaluated, so FO reading PASS at the validation gate cannot tell "R6 ran clean" from "R6 never ran". The task file lives on the shared state branch that implementation workers already write into (`boundary-crossed:` lines, workflow.md Number guards POC bullet), so the value R6 keys on is worker-writable; this is the same trust assumption R2 (`Applied at:`) and R4 (`Migration:`) already carry, extended to R6 rather than created here.
      attack_scenario: |
        1. A POC worker commits `apps/api/migrations/0007_x.sql` on its branch.
        2. While recording its stage report into the task file it leaves a BOM / blank first line, or rewrites `profile: poc` as `profile: poc  # fresh` (worker agents write into this file by design).
        3. FO runs `number_guards.py check --workflow-dir ... --task <task>` at validation and before merge; both print `PASS: no findings`, exit 0.
        4. Result: a schema file merges from a POC task with no `FAIL R6`, no `boundary-crossed: persistent-state` marker, and nothing in the output indicating R6 was skipped.
      blast_radius: "MEDIUM"
      recommendation: |
        Make R6's applicability visible in the output the way R4's is, and fail closed on an unreadable profile:
        ```python
        profile = frontmatter(task).get("profile")
        ...
        if facts and facts["poc"]:
            ...  # R6 loop
        elif facts is not None:
            out.append(f"R6 skipped: task profile is {facts['profile']!r}")
        ```
        and in `task_facts` carry `"profile": frontmatter(task).get("profile")` so a missing value is reported as `None` rather than hidden. Optionally have FO pass the profile it holds in `spacedock status` (`--profile poc`) so the guard does not depend solely on the worker-writable file. A test that a task file with a BOM / blank first line is reported, not silently passed, closes the class.

    - file: "kc-dev-flow-2/scripts/number_guards.py"
      line: 72
      severity: LOW
      category: "other"
      title: "New frontmatter(task) call decodes strictly, so one non-UTF-8 byte in any task file crashes check and reserve for every task"
      description: |
        `task_facts` deliberately reads the task with `errors="replace"` (line 64), but the added `frontmatter(task)` call (line 72) goes through `readme.read_text()` with strict decoding (line 49). A task file containing a byte that is not valid UTF-8 now raises an uncaught `UnicodeDecodeError`: `check` exits 1 with a Python traceback and no `FAIL` line (workflow.md tells FO exit 1 "lists FAIL R1..R6 lines"), and `reserve` globs every sibling `*.md` in the state dir and calls `task_facts` on each (lines 198-200), so one bad byte in any task breaks number reservation for all tasks. Fail-closed, availability only.
      attack_scenario: |
        1. A worker pastes a log excerpt or a Latin-1 string into its stage report inside any task file on the state branch.
        2. FO runs `number_guards.py reserve --kind migration --task <other task>`.
        3. `task_facts(sibling)` -> `frontmatter(sibling)` -> strict `read_text()` raises; the script dies with a traceback, exit 1, no `Migration:` line printed.
        4. Result: no task in the workflow can reserve a number, and `check --task <bad task>` reports exit 1 with no FAIL line, until someone finds and scrubs the byte.
      blast_radius: "MEDIUM"
      recommendation: |
        Parse the frontmatter from the text `task_facts` already read, instead of re-reading strictly:
        ```python
        text = task.read_text(errors="replace")
        meta = parse_frontmatter(text)   # split frontmatter() into read + parse
        ```
        or give `frontmatter()` an `errors="replace"` read. Add a test with a `b"\xff"` byte in a sibling task to lock it.

    - file: "kc-dev-flow-2/skills/implementation/principles.md"
