      description: |
        workflow.md now states `check` runs for a `poc` task "at the same three points" (implementation exit, validation, pre-merge), but the worker-side trigger in `implementation/principles.md` is unchanged: "When the task has a `## Number guards` section, ... run `number_guards.py check`". The POC bullet says a POC task "reserves no number", and nothing in this PR adds the section to a POC task, so the first of the three run points does not fire for a POC task unless FO adds an empty section by hand. The test fixture (`PocFreezeTests.poc_task`) writes `## Number guards` explicitly, so the tests do not exercise the task shape FO actually produces. Procedural, no code gate; the FO-run points (validation, pre-merge) are unaffected.
      attack_scenario: |
        1. FO dispatches a POC task from the template (no `## Number guards` section, no reserve run).
        2. The worker adds a migration, reaches implementation exit, reads principles.md, finds no section, does not run `check`, and reports no `boundary-crossed:` marker.
        3. The first detection is at the validation gate instead of implementation exit; the worker's report is silent on a crossing the workflow says it should record itself.
        4. Result: one of the three documented enforcement points is a no-op for the profile this PR targets.
      blast_radius: "LOW"
      recommendation: |
        Either make the principles.md trigger "when the task has a `## Number guards` section or `profile: poc`", or have the POC task template / FO dispatch carry an empty `## Number guards` section. Add a `test_poc_readme.py` assertion that the derived POC README's implementation stage references the check without the section precondition.

