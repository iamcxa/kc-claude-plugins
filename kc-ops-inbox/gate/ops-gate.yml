name: ops-gate
on:
  pull_request_review:
    types: [submitted]
permissions: {}
jobs:
  record:
    if: >-
      github.event.review.user.login == vars.OPS_CAPTAIN_LOGIN
      && startsWith(github.event.pull_request.head.ref, 'ops/')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out the default branch, whose scripts run
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Install the pinned tools
        env:
          OPS_TOOLS_DIR: ${{ runner.temp }}/tools
          OPS_SKIP_CLAUDE: "1"
        run: |
          bash kc-ops-inbox/trigger/install-tools.sh
          echo "$OPS_TOOLS_DIR/bin" >> "$GITHUB_PATH"
      - name: Record the gate from the Captain's review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROJECT_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OPS_CAPTAIN_LOGIN: ${{ vars.OPS_CAPTAIN_LOGIN }}
        run: node kc-ops-inbox/bin/record-gate.mjs
