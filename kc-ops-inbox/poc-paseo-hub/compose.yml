# The POC daemon. No bind mount of the host: all state lives in named volumes. POC_ENV_FILE may be /dev/null: the Codex login
# is made inside the container and no password is set.
services:
  paseo:
    image: ops-poc-paseo:local
    container_name: ops-poc-paseo
    ports:
      - "127.0.0.1:6768:6767"
    env_file: ${POC_ENV_FILE:?path of the Captain-owned env file outside the repository}
    volumes:
      - paseo-home:/home/paseo
      - workspace:/workspace
volumes:
  paseo-home:
  workspace:
