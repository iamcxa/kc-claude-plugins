tob_security_review:
  pr: none
  strategy: DEEP
  security_tier: full
  files_analyzed: 4   # delivery_gate.py, dispatch_records.py, test_delivery_gate.py (head only), workflow.md (lines 85-115, 520-545), all at 0cdb40a7
  scope_note: |
    Design-stage review of /tmp/psrg-c2/control-design.md (Scope, Acceptance criteria AC-9 to AC-14, Design).
    Attacker boundary applied as given: an outsider holds only public routes and files, published
    documents and hosted content. Writers to the repository, the deploy pipeline and the state
    checkout (FO, workers, validators, release staff) are excluded.
  findings: []
  clean_patterns:
    - "Design adds no public route, hosted endpoint or new outsider-readable file. The only published artifact it touches is kc-dev-flow-2/references/sd/workflow.md, which is already public. The new `Candidate:` line lands in the dispatch record, which FO writes in the state checkout (workflow.md ~line 100-103: dispatch/<stage>-<cycle>.md in the state checkout). Nothing in Design, AC-9 to AC-14 or Limits gives an outsider a write path."
    - "Design removes a parser of outsider-influenced text. At 0cdb40a7, delivery_gate.py `validated_candidate` takes a 7-40 hex SHA out of validator report prose, which can quote PR content the validator read. The design replaces it with a whole-line 40-hex field FO wrote (AC-10), and AC-12 pins that no validator prose, `Verdict`, `PASSED` or `REJECTED` is read. That is a smaller agent-document surface than base."
    - "delivery_gate.py is invoked only from FO's own merge-ask step. A repo-wide `git grep delivery_gate` at 0cdb40a7 finds it in workflow.md, the two README copies (docs/dev2, docs/dev2-poc), the CI step in .github/workflows/kc-dev-flow-2-tests.yml, and a word-budget comment in lint-skills.py. No hook, pr_watch.py or extension calls it, so no automated path feeds it an outsider-chosen PR number. AC-13 keeps mods, extensions and pr_watch.py byte-identical, so the design adds no new automated reader."
    - "`run_gh` builds an argv list (no shell). `PR` (`^([\\w.-]+/[\\w.-]+)#(\\d+)$`) restricts both the repo and the number before they reach `gh pr view --repo`. The design says the command, arguments, exits and gh code are unchanged, so no injection route is added."
    - "The design's new output lines (hold, differs, equals) print the task path, the PR head from gh, and FO-written 40-hex SHAs. The exit-2 hold line prints the fixed form `Candidate: <40-hex head>`. No outsider-authored free text reaches the output. The old output echoed a candidate that came from report prose."
    - "AC-10 fails closed, with exit 2, on a missing dispatch folder, a missing record, a missing line, an 8-character SHA, trailing text, the relay form `Candidate: spacedock <sha>; marketplace <sha>`, a line under the first `## ` heading, and a valid line only in an older record. This leaves no lenient parse that injected text could satisfy. AC-11 picks the record by numeric number, not sorted file name."
    - "Header-only reading (text above the first `## `) keeps text FO places under `## Checklist` and `## Scope notes` from being read as a candidate. In dispatch_records.py those sections hold the worker instruction text, so a `Candidate:` line quoted there is not picked up."
    - "The 7-character `--head` acceptance in AC-9 is not an outsider capability. The default head comes from `gh pr view --json headRefOid` (40 hex) and AC-10 pins the record line at 40 hex, so the comparison shortens only when an operator passes a short `--head` by hand. Producing a 28-bit prefix collision needs push access to the PR branch, which is a repository writer and so excluded."
    - "D1 (a bare line passes for any `--pr`) is weighed in the design. Exploiting it needs a head SHA shared across two PRs the task lists, which requires a repository writer. No outsider capability arises."
  limitations:
    - "Prompt-injection route not assessed as a finding, by design. PR comments or issue text from any GitHub user on a public adopter repo can reach FO as hosted content. The design moves the check from two sources (a validator-written report plus the PR head) to one FO-written line plus the PR head. AC-12 states that a task with no validation report at all, or a REJECTED report, exits 0. I did not report this because FO is an excluded actor and the design states and weighs it (Design § Limits, AC-12 Limit, the 'head FO writes is FO's own statement' limit). It would become a finding if an outsider could write FO's records or reports. I could not verify that from this repo."
    - "Cannot verify from this repo whether any adopter lets a dispatched worker or validator write to the state checkout. Nor can I verify whether any adopter accepts fork PRs, which would make PR content outsider-authored hosted content that the validator and FO read. That is the path the design narrows."
    - "Read at 0cdb40a7. The design's base is c545b896 (package 0.22.1). `git merge-base --is-ancestor` shows 0cdb40a7 is an ancestor of c545b896, so I read an older tree than the design observed. delivery_gate.py and workflow.md may differ between the two. At 0cdb40a7 delivery_gate.py had no `Candidate:` parser and no `dispatched_candidates`, consistent with the design's claim."
    - "Not inspected: the prototype at /tmp/gate-redo/proto/kc-dev-flow-2, the machine-local count scripts, PR #647 (head 0a26ca37), the archived tasks used in the AC-9 and AC-11 replays, and `spacedock` 0.27.2 behaviour. The design's counts (104 records, 37 tasks) and the replay observations are unverified by me."
    - "The implementation does not exist, so how `dispatched_candidates` resolves the task folder is not reviewed. dispatch_records.py uses `task.with_suffix('')` for a `.md` task and globs `dispatch/*.md`. Symlink or path handling in the new reader should get a code-stage review, though only a state-checkout writer could use it."
    - "No tests were run. No file was written, nothing was checked out, and only read-only git commands were used."
