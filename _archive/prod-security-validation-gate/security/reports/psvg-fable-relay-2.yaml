      description: |
        The guard `expect(llms).not.toMatch(/\/api\/|dev_|sec_|X-Subspace-Device/)` plus the
        route/method/action assertions block owner-side `/api/*` routes, device credentials,
        `/auth/*` (absent from the OpenAPI, so the "lacks" assertion rejects it) and the
        owner-only `claim`/`claim-owner`/`unbind` actions (absent from `RoomRequest`). One
        owner-side surface passes all three: a decision submission. Per
        `RoomFeedbackRequest` in `/tmp/psvg-measure/relay/tree/netlify/schema/room-page-contract.ts`
        a body with no `action` and a `result` whose Result carries `resolution` is the owner's
        decision; the test extracts actions only via `/\baction"?:"([a-z]+)"/`, so a future
        llms.txt that documented `"resolution"` for agents would pass. Today's llms.txt does not
        name it; this is a coverage gap in the new guard, not a live exposure.
      attack_scenario: |
        1. A later PR adds a "decide" recipe to llms.txt with a `result` containing `resolution`.
