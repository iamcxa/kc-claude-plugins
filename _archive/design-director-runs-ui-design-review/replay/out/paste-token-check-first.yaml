design_decline_check:
  rulings:
    - finding: 3
      ruling: upheld
      evidence: "In preview-rejected-desktop-light.png, preview-rejected-desktop-dark.png and preview-unreachable-desktop-light.png the top row reads \"Token works\" and the red line under the pasted field reads \"Not saved: ...\", so the prefix names the pasted token as the refused one and the top row stays the stored token's state. preview-opmissing-desktop-light.png is not in the picture set, so I read preview-opmissing-phone-light.png instead, which shows the same layout. A person could still reasonably wonder whether the stored token was replaced, but \"Not saved\" answers that and nothing in the pictures leads to a wrong action."
      change:
    - finding: 6
      ruling: overruled
      evidence: "declined: host component SettingsAction at /tmp/dd-replay/host/ui.d.ts. `SettingsActionProps` extends `SettingsRowProps` where `label` is a plain `string`, so the label can be any length and the \"as short as the component allows\" claim is wrong. preview-warning-desktop-light.png and preview-warning-two-desktop-light.png show \"Replace the token under relay-dev-read\" and \"Keep the current token\" only repeating the buttons and the heading; preview-warning-phone-dark.png shows the long label wrapping onto two lines."
      change: "Shorten the two labels (for example \"Replace token\" and \"Keep current token\"), keeping the project name only in the warning heading. Criterion: the warning card has no project name outside the heading and the field, and no action label wraps on phone."
    - finding: 7
      ruling: decision
      evidence: "declined: host component SettingsAction at /tmp/dd-replay/host/ui.d.ts. `SettingsActionProps` has only `actionLabel`, `onPress` and `disabled`, with no variant, style or width prop, and `SettingsRowProps.children` takes a ReactNode. A secondary Cancel and equal widths can therefore come only from the plugin's own react-native Pressable (the \"Icon\" and \"Modal\" parts in react-native.d.ts do not supply button variants), so the author's \"not available\" is wrong but a custom build is the only route. preview-warning-desktop-light.png and preview-warning-desktop-dark.png still show Replace and Cancel as equal solid buttons, but the warning text states that nothing is written until Replace is pressed, so no one is put at risk."
      change: "Captain: accepts or rejects a departure from the host's button look by drawing Cancel as an outline button and giving Replace and Cancel one width with the plugin's own parts."
    - finding: 9
      ruling: overruled
      evidence: "declined: host component SettingsInput at /tmp/dd-replay/host/ui.d.ts. `SettingsInputProps` has `disabled?: boolean`, so the name and token fields can be locked, and the author's \"no field lock\" is wrong. `Icon` in react-native.d.ts and the `children` slot of `SettingsRowProps` can carry a progress mark. preview-checking-desktop-light.png and preview-replace-checking-desktop-light.png show both fields drawn exactly as in idle, with only a grey \"Checking...\" button."
      change: "While checking, set `disabled` on both SettingsInput fields and render a progress mark (an Icon or a react-native ActivityIndicator) beside \"Checking...\". Criterion: the checking picture shows both fields in the disabled style and a visible mark. The 30 s timeout and the absence of a cancel control can stay as stated, since no host prop supplies a cancel."
    - finding: 11
      ruling: overruled
      evidence: "Set as a whole: preview-warning-two-desktop-light.png shows a two-project heading that fits on one desktop line, and preview-warning-phone-dark.png shows only the hint and the labels wrapping, not a long heading. No picture shows three or more sharing projects or a long name, so \"wrap as the two-project picture does\" is not shown by any picture. The long-name case is a real risk because a clipped heading would hide a project name that the warning exists to show. The read-only claim holds only as the author states it, since the proposal describes no read-only mode. preview-replace-rejected-desktop-light.png shows the error without the warning, so the warning-plus-error pairing never occurs."
      change: "Add two pictures (desktop and phone): one with three sharing projects and one with a long no-hyphen service account name. Criterion: the full list of project names stays readable in the heading and nothing is clipped."
    - finding: 12
      ruling: overruled
      evidence: "declined: host component SettingsAction at /tmp/dd-replay/host/ui.d.ts. `SettingsRowProps` has no style or size prop, so the roughly 34-36 px button height can only be changed with the plugin's own parts, and that part is a host-look departure. The name wrapping can be fixed without any host change, because `label` and `hint` are plain strings. preview-warning-phone-dark.png and preview-rejected-newproject-phone-light.png show \"relay-dev-\" then \"read\" split in the hint, the heading and the Replace label."
      change: "Write project names with non-breaking hyphens (U+2011) in label, hint and heading strings so a name stays whole. Criterion: the phone pictures show every project name on one line, with wrapping only between words. Touch target height is a decision for the host owner or Captain (accepting the plugin's own taller buttons), and it is not covered by this decline."
    - finding: 13
      ruling: overruled
      evidence: "declined: host component SettingsRow at /tmp/dd-replay/host/ui.d.ts. `SettingsRowProps` has `children?: ReactNode`, and react-native.d.ts exports `Icon` (`PluginIconProps`), so an icon can be rendered inside the row. preview-warning-desktop-light.png and preview-warning-desktop-dark.png show an orange bold heading, so the warning is already the author's own coloured text and not plain hint text, with no icon, and the red error lines in the rejected pictures have no icon either."
      change: "Render an `Icon` (a warning triangle) beside the warning heading and an error icon beside the error line, using the row's `children` slot or the plugin's own view. Criterion: the warning and error states in the light and dark pictures are identifiable without colour."
