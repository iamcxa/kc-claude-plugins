# Browser E2E CI Gate — Generated by e2e-pipeline plugin
#
# USAGE: Copy this file to .github/workflows/browser-e2e.yml
# then customize the matrix.flow list and E2E_BASE_URL source.
#
# PREREQUISITES:
#   - Compiled E2E scripts in .claude/e2e/compiled/*.sh
#     (run /e2e-compile inside Claude Code to generate them)
#   - agent-browser CLI (installed automatically by this workflow)
#
# CUSTOMIZATION:
#   - matrix.flow: List your compiled flow script names (without .sh extension)
#   - E2E_BASE_URL: Set to your deployment preview URL
#   - max-parallel: Adjust based on your CI runner capacity (default: 3)
#   - timeout-minutes: Adjust based on your longest flow (default: 20)
#
# WORKFLOW STRUCTURE:
#   auth-setup  →  browser-e2e (matrix)  →  report
#   AUTH-01: Login once, reuse session across all parallel flows

name: Browser E2E

on:
  pull_request:
    branches: [main]
  # Uncomment for push-triggered runs:
  # push:
  #   branches: [main]

# Cancel in-progress runs for the same PR (prevents stale E2E runs blocking merges)
concurrency:
  group: e2e-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # CI-04: Auth setup runs before matrix, uploads session directory
  # AUTH-01: Login once, reuse session across all parallel flows
  # If your app doesn't require authentication, remove auth-setup job and needs: [auth-setup]
  auth-setup:
    name: Auth Setup
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      # MAINT-01: Warn if mapping files are stale relative to UI source changes
      - name: Check mapping staleness
        run: |
          # UI_PATHS: directories containing UI source code
          # CUSTOMIZE: adjust to match your project structure
          UI_PATHS="src/ app/ pages/ components/"
          for mapping in .claude/e2e/mappings/*.yaml; do
            [ -f "$mapping" ] || continue
            app=$(basename "$mapping" .yaml)
            # Get ISO date of mapping's last git commit
            mapping_date=$(git log -1 --format="%ai" -- "$mapping" 2>/dev/null)
            if [ -z "$mapping_date" ]; then
              echo "::notice::Mapping '$app' is not tracked by git -- skipping staleness check"
              continue
            fi
            # Count UI file changes after the mapping was last updated
            ui_changes=$(git log --after="$mapping_date" --oneline -- $UI_PATHS 2>/dev/null | wc -l | tr -d ' ')
            if [ "$ui_changes" -gt 0 ]; then
              echo "::warning::Mapping '$app' may be stale: $ui_changes UI change(s) since $(echo $mapping_date | cut -d' ' -f1). Consider running /e2e-map."
            fi
          done

      # Cache key matches browser-e2e exactly to share the same Chrome binary.
      - name: Cache agent-browser Chrome
        uses: actions/cache@v4
        with:
          path: ~/.cache/agent-browser
          key: agent-browser-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            agent-browser-${{ runner.os }}-

      - name: Install agent-browser
        run: |
          npm install -g agent-browser
          agent-browser install

      # Pitfall 3: Session dir discovery handles agent-browser version differences
      - name: Discover session directory
        id: session-dir
        run: |
          SESSION_DIR=$(agent-browser session dir 2>/dev/null || echo "$HOME/.config/agent-browser")
          echo "path=$SESSION_DIR" >> "$GITHUB_OUTPUT"

      # Credentials: compiled login-flow.sh may have hardcoded test creds from flow YAML.
      #   For production: use GHA secrets via E2E_TEST_EMAIL/E2E_TEST_PASSWORD env vars
      - name: Run login flow
        env:
          E2E_BASE_URL: http://localhost:3000   # CUSTOMIZE: same as browser-e2e
          # For CI secrets: uncomment and set in GitHub repo settings
          # E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          # E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: |
          chmod +x .claude/e2e/compiled/login-flow.sh
          .claude/e2e/compiled/login-flow.sh

      # retention-days: 1 is intentionally short — auth sessions may contain cookies/tokens
      - name: Upload auth session
        uses: actions/upload-artifact@v4
        with:
          name: auth-session
          retention-days: 1        # Short retention — session may contain auth cookies
          path: ${{ steps.session-dir.outputs.path }}

  browser-e2e:
    name: E2E / ${{ matrix.flow }}
    needs: [auth-setup]
    runs-on: ubuntu-latest
    timeout-minutes: 20          # CUSTOMIZE: adjust for your longest flow

    strategy:
      fail-fast: false           # CI-05: continue other flows even if one fails
      max-parallel: 3            # CI-05: cap concurrent browser jobs to avoid runner exhaustion
      matrix:
        flow:                    # CUSTOMIZE: list your compiled flow names (without .sh extension)
          - login-flow
          - catalog-browse
          - smoke-all-pages

    steps:
      - uses: actions/checkout@v6

      # Cache Chromium binary to avoid repeated downloads on every run.
      # Cache key invalidates when package-lock.json changes (agent-browser version bump).
      - name: Cache agent-browser Chrome
        uses: actions/cache@v4
        with:
          path: ~/.cache/agent-browser
          key: agent-browser-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            agent-browser-${{ runner.os }}-

      # Install agent-browser globally (not as a project dependency).
      # `agent-browser install` downloads the headless Chromium binary.
      - name: Install agent-browser
        run: |
          npm install -g agent-browser
          agent-browser install

      # Pitfall 3: match auth-setup path — session dir may vary by agent-browser version
      - name: Discover session directory
        id: session-dir
        run: |
          SESSION_DIR=$(agent-browser session dir 2>/dev/null || echo "$HOME/.config/agent-browser")
          echo "path=$SESSION_DIR" >> "$GITHUB_OUTPUT"

      - name: Download auth session
        uses: actions/download-artifact@v4
        with:
          name: auth-session
          path: /tmp/auth-session

      - name: Restore auth session
        run: |
          mkdir -p ${{ steps.session-dir.outputs.path }}
          cp -r /tmp/auth-session/. ${{ steps.session-dir.outputs.path }}/

      # Run the compiled flow script with JUnit output and --continue-on-error
      # so the workflow step does not fail immediately — let the upload-artifact
      # step always run and collect results.
      - name: Run compiled flow
        env:
          E2E_BASE_URL: http://localhost:3000   # CUSTOMIZE: your deployment URL
          # For Netlify/Vercel preview URLs, replace with:
          # E2E_BASE_URL: ${{ needs.deploy.outputs.preview_url }}
          #
          # For carlove integration, replace with:
          # E2E_BASE_URL: ${{ needs.detect.outputs.deploy_preview_url }}
          # and add: needs: [detect, wait-netlify-preview, auth-setup]
        run: |
          chmod +x .claude/e2e/compiled/${{ matrix.flow }}.sh
          .claude/e2e/compiled/${{ matrix.flow }}.sh \
            --junit /tmp/junit-${{ matrix.flow }}.xml \
            --continue-on-error

      # CI-02: Failure artifacts persist on both pass and fail for debugging
      # CI-02: Screenshots and trace uploaded alongside JUnit XML for debugging
      # Artifact name includes github.run_id to prevent cross-run artifact collisions (Pitfall 4).
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()             # Upload on both pass and fail
        with:
          name: e2e-results-${{ matrix.flow }}-${{ github.run_id }}
          retention-days: 7
          path: |
            /tmp/junit-${{ matrix.flow }}.xml
            /tmp/e2e-screenshots/
            /tmp/e2e-trace/

  # Report job aggregates all matrix results into one GitHub check annotation
  # fail_on_failure: true makes this a release gate — PR blocked on E2E failure
  # If you don't need PR check annotations, remove the report job
  report:
    name: E2E Report
    needs: [browser-e2e]
    if: always()                    # Run even when test jobs fail
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # merge-multiple: true combines all e2e-results-* artifacts into one directory
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-results-*
          path: junit-results
          merge-multiple: true

      - name: Publish JUnit report
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: 'junit-results/**/*.xml'
          fail_on_failure: true    # Creates hard CI gate — PR cannot merge with failures
          check_name: 'E2E Test Results'
          summary: true
