# Browser E2E CI Gate — Generated by e2e-pipeline plugin
#
# USAGE: Copy this file to .github/workflows/browser-e2e.yml
# then customize the matrix.flow list and E2E_BASE_URL source.
#
# PREREQUISITES:
#   - Compiled E2E scripts in .claude/e2e/compiled/*.sh
#     (run /e2e-compile inside Claude Code to generate them)
#   - agent-browser CLI (installed automatically by this workflow)
#
# CUSTOMIZATION:
#   - matrix.flow: List your compiled flow script names (without .sh extension)
#   - E2E_BASE_URL: Set to your deployment preview URL
#   - max-parallel: Adjust based on your CI runner capacity (default: 3)
#   - timeout-minutes: Adjust based on your longest flow (default: 20)

name: Browser E2E

on:
  pull_request:
    branches: [main]
  # Uncomment for push-triggered runs:
  # push:
  #   branches: [main]

# Cancel in-progress runs for the same PR (prevents stale E2E runs blocking merges)
concurrency:
  group: e2e-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    name: E2E / ${{ matrix.flow }}
    runs-on: ubuntu-latest
    timeout-minutes: 20          # CUSTOMIZE: adjust for your longest flow

    strategy:
      fail-fast: false           # CI-05: continue other flows even if one fails
      max-parallel: 3            # CI-05: cap concurrent browser jobs to avoid runner exhaustion
      matrix:
        flow:                    # CUSTOMIZE: list your compiled flow names (without .sh extension)
          - login-flow
          - catalog-browse
          - smoke-all-pages

    steps:
      - uses: actions/checkout@v6

      # Cache Chromium binary to avoid repeated downloads on every run.
      # Cache key invalidates when package-lock.json changes (agent-browser version bump).
      - name: Cache agent-browser Chrome
        uses: actions/cache@v4
        with:
          path: ~/.cache/agent-browser
          key: agent-browser-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            agent-browser-${{ runner.os }}-

      # Install agent-browser globally (not as a project dependency).
      # `agent-browser install` downloads the headless Chromium binary.
      - name: Install agent-browser
        run: |
          npm install -g agent-browser
          agent-browser install

      # Run the compiled flow script with JUnit output and --continue-on-error
      # so the workflow step does not fail immediately — let the upload-artifact
      # step always run and collect results.
      - name: Run compiled flow
        env:
          E2E_BASE_URL: http://localhost:3000   # CUSTOMIZE: your deployment URL
          # For Netlify/Vercel preview URLs, replace with:
          # E2E_BASE_URL: ${{ needs.deploy.outputs.preview_url }}
          #
          # For carlove integration, replace with:
          # E2E_BASE_URL: ${{ needs.detect.outputs.deploy_preview_url }}
          # and add: needs: [detect, wait-netlify-preview]
        run: |
          chmod +x .claude/e2e/compiled/${{ matrix.flow }}.sh
          .claude/e2e/compiled/${{ matrix.flow }}.sh \
            --junit /tmp/junit-${{ matrix.flow }}.xml \
            --continue-on-error

      # Upload JUnit XML (and any screenshots) for every run — pass and fail.
      # Artifact name includes github.run_id to prevent cross-run artifact collisions.
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()             # Upload on both pass and fail
        with:
          name: e2e-results-${{ matrix.flow }}-${{ github.run_id }}
          retention-days: 7
          path: |
            /tmp/junit-${{ matrix.flow }}.xml
