# native-css-mapping.yaml
# TEST FIXTURE — canonical selector forms only
#
# Contains ONLY agent-browser-native selector grammar per design.md Candidate 2
# decision (course-corrected from Cand 1 after PR #8 Copilot review caught the
# subcommand-vs-selector confusion in Cand 1).
#
# `lint-mapping.sh native-css-mapping.yaml` must exit 0.
#
# Canonical forms (per design.md Captain Decision 2026-05-04, course-corrected 2026-05-05):
#   - [data-testid="..."]             CSS attribute selector (preferred — most stable)
#   - [role="<r>"][aria-label="<v>"]  CSS attribute selector for role+aria-label elements
#   - [role="<r>"]                    CSS role only (fallback when aria-label not stable)
#   - .SomeClass:nth-of-type(N)       CSS nth pseudo for repeated elements
#
# RNW edge case (rabbit-hole): components emitting `role` without matching
# `aria-label` (accessible name from textContent / aria-labelledby) — for those,
# add `data-testid` to the component instead. Pure-`find role` subcommand
# resolution can't be expressed as a yaml selector string (it's a CLI subcommand
# chain, not a selector grammar). Migrating those is a separate pitch.

version: "2"
base_url: "http://localhost:3000"

elements:
  # CSS data-testid attribute selector (preferred when testid is available)
  email_input:
    selector: '[data-testid="email-input"]'
    name: Email input field

  # CSS role + aria-label attribute selector
  submit_button:
    selector: '[role="button"][aria-label="Submit"]'
    name: Submit button

  # CSS role + aria-label for tab-like elements
  lineage_tab:
    selector: '[role="tab"][aria-label="Lineage"]'
    name: Lineage tab

  # CSS attribute fallback — explicit aria-label always works as native selector
  nav_close_button:
    selector: '[role="button"][aria-label="Close navigation"]'
    name: Navigation close button

  # CSS nth-of-type for repeated elements (replaces banned >> nth=N chord)
  third_list_item:
    selector: '.RecordList-item:nth-of-type(3)'
    name: Third list item

  # Nested CSS selector — pure CSS, no banned tokens
  modal_title:
    selector: '[data-testid="confirm-modal"] h2'
    name: Confirm modal title heading
