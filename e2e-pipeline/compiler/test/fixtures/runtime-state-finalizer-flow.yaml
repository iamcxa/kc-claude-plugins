name: runtime-state-finalizer-flow
description: "SC-1032: Runtime capture, sensitive fill via stdin, and finalizer lifecycle"
tags: [sc-1032, booking, e2e]
mapping: runtime-state-finalizer-mapping
runtime_values:
  booking_password:
    from_env: E2E_BOOKING_PASSWORD
    sensitive: true
  admin_token:
    from_env: E2E_ADMIN_TOKEN
    sensitive: true
  api_base_url:
    from_env: E2E_API_BASE_URL
    sensitive: false
variables:
  base_url: "http://localhost:3000"
steps:
  - id: navigate-to-checkout
    type: navigate
    action: "Navigate to /checkout"

  - id: fill-password
    type: fill
    action: "Fill password_input on checkout"
    value:
      runtime_ref: booking_password

  - id: confirm-booking
    type: click
    action: "Click confirm_button on checkout"

  - id: capture-booking-id
    type: capture-url-query
    action: "Capture bookingId from URL query"
    query: bookingId
    save_as: booking_id
    validate: uuid

  - id: verify-confirmation-heading
    type: snapshot
    action: "Take snapshot"

finally:
  - id: cancel-booking-finalizer
    type: http
    action: "Cancel captured booking"
    request:
      method: POST
      url:
        base_from_env: E2E_API_BASE_URL
        path_segments: [api, admin, bookings, { runtime_ref: booking_id }, cancel]
      headers:
        Authorization: { scheme: Bearer, runtime_ref: admin_token }
      json:
        reason: sc-1032-test
    expect:
      status: 200

  - id: verify-booking-cancelled-finalizer
    type: http
    action: "Read back cancelled booking state"
    request:
      method: GET
      url:
        base_from_env: E2E_API_BASE_URL
        path_segments: [api, admin, bookings, { runtime_ref: booking_id }]
      headers:
        Authorization: { scheme: Bearer, runtime_ref: admin_token }
    expect:
      status: 200
      body_field:
        object: data
        field: status
        equals_literal: cancelled
