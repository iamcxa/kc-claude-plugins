# Scenario 1 — the dominant shape: sign in, land somewhere, confirm it.
#
# Actions and expects are the measured top of the real corpus:
#   Click 39% · Navigate 18% · Wait 14% · Fill 11% · Verify 10%   = 91% of 271 actions
#   "visible on" 53% · "url contains" 34%                          = 87% of 317 expects
#
# Selector forms exercised here: plain CSS and [data-testid=] — 68% of the corpus between
# them, and the two that need no `css_selector` companion.
name: happy-path-auth
description: "Sign in and reach the dashboard"
tags: [happy-path]
mapping: happy-path-app
# No `variables:` block. Zero flows in the corpus interpolate a variable into a Fill
# value, and a first draft of this fixture did — inventing a shape nobody writes, which
# is what this gate's header says not to do. It also silently did the wrong thing:
# `${email}` is emitted inside single quotes and never bound, so the literal characters
# would be typed into the field. Tracked separately; this fixture stays literal.
steps:
  - id: open-login
    type: navigate
    action: "Navigate to /login"
    expect:
      - "email_input visible on login"
      - "url contains /login"

  - id: fill-email
    type: fill
    action: "Fill email_input with 'user@example.com' on login"

  - id: fill-password
    type: fill
    action: "Fill password_input with 'correct horse' on login"

  - id: submit
    type: click
    action: "Click submit_button on login"

  - id: settle
    type: wait
    action: "Wait 2"

  - id: reached-dashboard
    type: snapshot
    action: "Verify welcome_heading on dashboard"
    expect:
      - "url contains /dashboard"
      - "welcome_heading visible on dashboard"
      - "error_banner not visible on login"
