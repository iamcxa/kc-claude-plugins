name: selector-grammar-fixture-flow
mapping: test-app
description: |
  Smoke flow exercising native (Cand 2 CSS attribute) selector forms against the
  test-app mapping. Used by T3.1 integration smoke and as the in-tree example of
  post-001 selector grammar.

  The forms below are a subset of the grammar, not the grammar. The authority for
  what is permitted is CLAUDE.md § Selector Priority, not this description. This
  flow exercises the CSS-attribute end of it:
  - [data-testid="<id>"]              (priority 1 — most stable)
  - [role="<r>"][aria-label="<v>"]    (priority 4 — only where a literal aria-label exists)
  - .Class:nth-of-type(N)             (replaces the banned `>> nth=N` chord)

  It deliberately does not exercise `role=<r>[name="<v>"]` or `text=<v>`, which are
  priorities 2 and 3 and are NOT banned. Carries none of the still-banned forms
  (`>> nth=N`, `has-text(`, or a `find ...` subcommand stored as a selector value).

  Note: the runner resolves `mapping: test-app` to `.claude/e2e/mappings/test-app.yaml`
  per e2e-pipeline convention. This flow assumes captain has copied or symlinked
  the compiler test fixture (e2e-pipeline/compiler/test/fixtures/test-app.yaml)
  into that location, OR provides an alternate mapping with the same element keys
  (email_input / password_input / login_button / heading / sidebar_home).

steps:
  - id: visit_root
    action: navigate
    url: http://localhost:8000

  - id: assert_login_visible
    action: assert
    selector_key: email_input
    expect: visible

  - id: fill_email
    action: fill
    selector_key: email_input
    value: test@example.com

  - id: fill_password
    action: fill
    selector_key: password_input
    value: testpassword

  - id: click_login
    action: click
    selector_key: login_button
    expect:
      - url contains /dashboard

  - id: assert_dashboard_heading
    action: assert
    selector_key: heading
    expect: visible

  - id: assert_sidebar_home
    action: assert
    selector_key: sidebar_home
    expect: visible
