name: selector-grammar-fixture-flow
mapping: test-app
description: |
  Smoke flow exercising native (Cand 2 CSS attribute) selector forms against the
  test-app mapping. Used by T3.1 integration smoke and as the in-tree example of
  post-001 selector grammar.

  All selectors in the referenced mapping use the canonical native contract:
  - [data-testid="<id>"]              (preferred — most stable)
  - [role="<r>"][aria-label="<v>"]    (CSS attribute form for role-named elements)
  - .Class:nth-of-type(N)             (replaces banned `>> nth=N`)

  No banned Playwright forms (role=X[name=Y], >> nth=N, bare text=, has-text()).

  Note: the runner resolves `mapping: test-app` to `.claude/e2e/mappings/test-app.yaml`
  per e2e-pipeline convention. This flow assumes captain has copied or symlinked
  the compiler test fixture (e2e-pipeline/compiler/test/fixtures/test-app.yaml)
  into that location, OR provides an alternate mapping with the same element keys
  (email_input / password_input / login_button / heading / sidebar_home).

steps:
  - id: visit_root
    action: navigate
    url: http://localhost:8000

  - id: assert_login_visible
    action: assert
    selector_key: email_input
    expect: visible

  - id: fill_email
    action: fill
    selector_key: email_input
    value: test@example.com

  - id: fill_password
    action: fill
    selector_key: password_input
    value: testpassword

  - id: click_login
    action: click
    selector_key: login_button
    expect:
      - url contains /dashboard

  - id: assert_dashboard_heading
    action: assert
    selector_key: heading
    expect: visible

  - id: assert_sidebar_home
    action: assert
    selector_key: sidebar_home
    expect: visible
